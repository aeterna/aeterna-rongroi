# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.

# The scan is full so that recorded_files reads the change journal once (ADR 0086, J2). The file was renamed
# while it ran, so the journal holds an old-name and a new-name record in Downloads, and I5 is true when one of
# them falls in the window before the session. The name the process list reports for a program renamed while it
# runs is not documented here; the first replay shows it, and this expect is changed then if it is renamed.exe.
found: []
full: true
game_windows:
  - name: renamer.exe
    facts:
      t1: true
      i5: true
