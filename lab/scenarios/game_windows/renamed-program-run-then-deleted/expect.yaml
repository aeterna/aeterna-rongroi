# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.

# BAM records helper.exe's run in the window before the session. Its path is the \Device\HarddiskVolumeN\ shape
# that bam withholds, so I1 is not known for want of a path (ADR 0078, "P7 decisions" item 3).
found: []
game_windows:
  - name: helper.exe
    facts:
      t1: true
      i1: not_known:no_path
      # helper.exe is known only from BAM, whose path is withheld until ADR 0087's drive map, so the change
      # journal cannot be asked about it (ADR 0086, "Measured: J4").
      i5: not_known:no_path
