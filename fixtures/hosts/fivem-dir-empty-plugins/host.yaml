# Synthetic fixture host — see ../PROVENANCE.md.
# FiveM installed and its plugin folder is empty: the collector looked and there was nothing to see.
platform: windows
os_build: "26100"
elevated: false
env:
  LOCALAPPDATA: 'C:\Users\fixtureuser\AppData\Local'
filesystem:
  'C:\Users\fixtureuser\AppData\Local\FiveM\FiveM.app\plugins': []
