# FiveM for GTA V Legacy with all three launch-mode resource caches, each with a `db` index folder
# (ADR 0062, amending ADR 0053). The default cache's index holds three files with times, one file the
# listing gave no times for and a subfolder; its `unconfirmed` folder holds a file, which is never read.
# The `priv` cache's index cannot be listed. The `fxdk` cache's index is empty. Every name, size and time
# is invented.
