# resource cache's index written after it — and created months after the oldest cache file beside it —,
# the priv index that cannot be listed, the fxdk index empty. Enhanced: its log folder last written more than
# ten minutes before the end, and no per-server cache folder. Every name, size and time is invented; the
# Prefetch and BAM bytes are the synthetic files in fixtures/parsers/. No process of FiveM's is running.
# Not a measured PC.
