# Synthetic fixture host — see ../PROVENANCE.md.
# FiveM for GTA V Legacy installed, three entries in its plugin folder: a file whose hash and signature
# can be read, a file whose hash and signature cannot, and a subdirectory. The hash is the SHA-256 of an
# empty file, so nothing here describes real software — and an empty file has no signature to embed,
# which is what the first file's `signature` says. The Enhanced edition is not installed.
platform: windows
os_build: "26100"
elevated: false
env:
  LOCALAPPDATA: 'C:\Users\fixtureuser\AppData\Local'
  APPDATA: 'C:\Users\fixtureuser\AppData\Roaming'
filesystem:
  'C:\Users\fixtureuser\AppData\Local\FiveM\FiveM.app\plugins':
    - name: example-plugin.dll
      sha256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      signature: { state: no_embedded_signature }
    - name: unreadable-plugin.dll
    - name: cache
      directory: true
