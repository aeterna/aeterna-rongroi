# Synthetic fixture host — see ../PROVENANCE.md.
# The shape BAM is expected to write on a real machine and the reason this collector withholds a
# path: a device path carries an account name with no drive letter in front of it, so SS-mode
# redaction cannot reach it (ADR 0023). The account name `deviceuser` is invented.
platform: windows
os_build: "26100"
elevated: true
registry:
  'HKLM\SYSTEM\CurrentControlSet\Services\bam\State\UserSettings\S-1-5-21-1723019388-1114836358-2137285072-1001':
    '\Device\HarddiskVolume3\Users\deviceuser\Downloads\Tool.exe':
      from: '../../parsers/bam/documented-24-byte-value.bin'
