# Synthetic fixture host — see ../PROVENANCE.md.
# A scan without administrator rights with nothing of FiveM's running (ADR 0062 section 5): Prefetch and BAM
# are refused, so when FiveM for GTA V Legacy, whose FiveM.exe is present, last ran is not known — no
# comparison, and none with the scan's time. Enhanced is not installed and has no statement. Every name and
# time is invented. Not a measured PC.
platform: windows
os_build: "26100"
elevated: false
env:
  SystemRoot: 'C:\Windows'
  LOCALAPPDATA: 'C:\Users\fixtureuser\AppData\Local'
  APPDATA: 'C:\Users\fixtureuser\AppData\Roaming'
access_denied:
  - 'C:\Windows\Prefetch'
  - 'HKLM\SYSTEM\CurrentControlSet\Services\bam\State\UserSettings'
processes:
  - pid: 4
    name: System
filesystem:
  'C:\Windows\Prefetch': []
  'C:\Users\fixtureuser\AppData\Local\FiveM':
    - name: FiveM.exe
      sha256: 5555555555555555555555555555555555555555555555555555555555555555
      signature: { state: no_embedded_signature }
  'C:\Users\fixtureuser\AppData\Local\FiveM\FiveM.app\plugins': []
  'C:\Users\fixtureuser\AppData\Local\FiveM\FiveM.app\logs':
    - name: CitizenFX_log_a.log
      size: 2048
      created: 2025-12-20T10:00:00Z
      modified: 2025-12-20T11:00:00Z
