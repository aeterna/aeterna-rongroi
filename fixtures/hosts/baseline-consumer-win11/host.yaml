# Synthetic fixture host — see ../PROVENANCE.md.
#
# A baseline (ADR 0017): this host asserts "a machine like this is unremarkable", and
# `cargo xtask check-baseline` requires the whole rule set to stay quiet on it. "Ordinary" is not one
# machine, which is why there is more than one baseline: this is the second profile, and it differs
# from `baseline-hardened-win11` in the two ways a player's PC usually differs.
#
# Profile: an ordinary consumer Windows 11 PC. Secure Boot on, test signing off, a TPM 2.0 present —
# and no memory-integrity policy key at all, which is what a machine that was never told either way
# looks like and is very common. FiveM is installed with an empty plugin folder, so `fivem_dir` looked
# at a real folder and there was nothing in it, and with `FiveM.exe` signed as it was measured on a real
# install (ADR 0036).
platform: windows
os_build: "26100"
elevated: false
env:
  LOCALAPPDATA: 'C:\Users\fixtureuser\AppData\Local'
  APPDATA: 'C:\Users\fixtureuser\AppData\Roaming'
# Microsoft Defender's exclusions are refused to a token without administrator rights, as measured on a
# runner and a Windows 11 PC (ADR 0060), so `defender_exclusion` is `not_admin` here.
access_denied:
  - 'HKLM\SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths'
registry:
  # What Windows says this installation is, and how the services Windows ships with are set to start
  # (ADR 0056). Every value below was measured on one Windows 11 PC (build 26220, DisplayVersion 25H2)
  # on 2026-09-20 with an elevated token — including `ProductName`, which still reads "Windows 10 Home"
  # on a genuine Windows 11, and the OEM information an ordinary retail board carries.
  'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion':
    ProductName: "Windows 10 Home"
    EditionID: "Core"
    CompositionEditionID: "Core"
    DisplayVersion: "25H2"
    CurrentBuild: "26220"
    UBR: 9492
    BuildLabEx: "26100.6.amd64fre.ge_release_flt.260716-1700"
    InstallationType: "Client"
    RegisteredOrganization: ""
  'HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\OEMInformation':
    Manufacturer: "Msi"
    Model: "MS-7A36"
    SupportURL: "http://www.msi.com/"
  'HKLM\SYSTEM\CurrentControlSet\Services\WinDefend':
    Start: 2
  # Measured on the same PC on 2026-09-21 (ADR 0057): object-namespace protection as Windows ships
  # it, and no override of the speculative-execution mitigations and no SEHOP switch written at all.
  'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager':
    ProtectionMode: 1
  'HKLM\SYSTEM\CurrentControlSet\Services\EventLog':
    Start: 2
  'HKLM\SYSTEM\CurrentControlSet\Services\SysMain':
    Start: 2
  'HKLM\SYSTEM\CurrentControlSet\Services\DPS':
    Start: 2
  'HKLM\SYSTEM\CurrentControlSet\Services\WSearch':
    Start: 2
  'HKLM\SYSTEM\CurrentControlSet\Services\DiagTrack':
    Start: 2
  'HKLM\SYSTEM\CurrentControlSet\Services\wuauserv':
    Start: 3
  'HKLM\SYSTEM\CurrentControlSet\Services\WerSvc':
    Start: 3
  # ADR 0054: the proxy off and FiveM's firewall rules, as on `baseline-elevated-win11`; both were
  # read without administrator rights on the PC measured. No `%SystemRoot%` is set here, so the hosts
  # file is not read on this host.
  'HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings':
    ProxyEnable: 0
  'HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\FirewallRules':
    fixture-rule-1: 'v2.10|Action=Allow|Active=TRUE|Dir=In|Protocol=6|Profile=Private|App=C:\users\fixtureuser\appdata\local\fivem\fivem.exe|Name=fivem|Desc=fivem|Defer=User|'
    fixture-rule-2: 'v2.10|Action=Allow|Active=TRUE|Dir=In|Protocol=17|Profile=Private|App=C:\users\fixtureuser\appdata\local\fivem\fivem.exe|Name=fivem|Desc=fivem|Defer=User|'
  'HKLM\SYSTEM\CurrentControlSet\Control\SecureBoot\State':
    UEFISecureBootEnabled: 1
filesystem:
  'C:\Users\fixtureuser\AppData\Local\FiveM\FiveM.app\plugins': []
  # FiveM.exe as a Legacy install has it, measured 2026-09-13 on one Windows 11 machine (build 26220):
  # its SHA-256, and a valid embedded signature from "Rockstar Games, Inc." with the certificate SHA-256
  # below. See ../PROVENANCE.md and ADR 0036. The folder's other entries are not reported and not listed.
  'C:\Users\fixtureuser\AppData\Local\FiveM':
    - name: FiveM.app
      directory: true
    - name: FiveM.exe
      sha256: 891e48128dc9c287aaa204757acac61d469eef9de82714cec4404d254a73c844
      signature:
        state: valid
        signer: Rockstar Games, Inc.
        signer_cert_sha256: 65866007102ff66498c1ef739cf23dff71ae3d08da0d9d759b89d1a409c4208f
code_integrity:
  enabled: true
  test_signing: false
tpm:
  present: true
  spec_version: "2.0"
# Firmware (ADR 0038): a scan without administrator rights cannot read the firmware's Secure Boot
# variable, so this is what it gets — measured on a real Windows 11 machine under a limited token, not
# chosen. No PowerShell policy key is written: Windows ships with none (fixtures/hosts/PROVENANCE.md).
firmware:
  secure_boot: access_denied
# The IOMMU's ACPI table (ADR 0038, amendment of 2026-10-15): IVRS, measured on the AMD development PC under a limited token on 2026-10-15: the ACPI table list needs no administrator rights.
iommu_table: ivrs
processes:
  - pid: 4
    name: System
  - pid: 1024
    name: explorer.exe
    path: 'C:\Windows\explorer.exe'
  - pid: 5120
    name: FiveM.exe
    path: 'C:\Users\fixtureuser\AppData\Local\FiveM\FiveM.exe'
# The PCI devices Windows remembers (ADR 0069, ADR 0070): shaped like the development PC ADR 0069 measured — host
# bridges and an SMBus controller with no driver service and problem code 0, the rest with their drivers, all
# present, all set up the day Windows was installed and last arrived at the last start. Every device id is
# invented; the vendor ids are the chipset, storage, display, network and audio makers such a PC has.
devices:
  - { id: 'PCI\VEN_1022&DEV_A0F0&SUBSYS_00000000&REV_00\3&2411e6fe&0&00', present: true, compatible_ids: ['PCI\CC_060000', 'PCI\CC_0600'], problem_code: 0, first_install: '2026-03-02T09:14:20Z', last_arrival: '2026-10-09T08:46:15Z' }
  - { id: 'PCI\VEN_1022&DEV_A0F1&SUBSYS_00000000&REV_00\3&2411e6fe&0&08', present: true, compatible_ids: ['PCI\CC_060000', 'PCI\CC_0600'], problem_code: 0, first_install: '2026-03-02T09:14:20Z', last_arrival: '2026-10-09T08:46:15Z' }
