  - { id: 'PCI\VEN_1022&DEV_A0F3&SUBSYS_A0F31022&REV_71\3&2411e6fe&0&A0', present: true, compatible_ids: ['PCI\CC_0C0500', 'PCI\CC_0C05'], problem_code: 0, first_install: '2026-03-02T09:14:20Z', last_arrival: '2026-10-09T08:46:15Z' }
  - { id: 'PCI\VEN_1022&DEV_A0F4&SUBSYS_88D21043&REV_00\3&2411e6fe&0&09', present: true, compatible_ids: ['PCI\CC_060400', 'PCI\CC_0604'], service: pci, problem_code: 0, first_install: '2026-03-02T09:14:20Z', last_arrival: '2026-10-09T08:46:15Z' }
  - { id: 'PCI\VEN_144D&DEV_A0F5&SUBSYS_A801144D&REV_00\4&1f2e3d4c&0&0009', present: true, compatible_ids: ['PCI\CC_010802', 'PCI\CC_0108'], service: stornvme, problem_code: 0, first_install: '2026-03-02T09:14:20Z', last_arrival: '2026-10-09T08:46:15Z' }
