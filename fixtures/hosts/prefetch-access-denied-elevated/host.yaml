# Synthetic fixture host — see ../PROVENANCE.md.
# The same denial with the administrator rights already held. Restarting would not help, so the
# reason is `access_denied` and not `not_admin`: a report that suggested the restart here would be
# suggesting something that cannot work.
platform: windows
os_build: "26100"
elevated: true
env:
  SystemRoot: 'C:\Windows'
filesystem:
  'C:\Windows\Prefetch':
    - name: CMD.EXE-D269B812.pf
      from: '../../prefetch/win10-compressed-v30-CMD.EXE-D269B812.pf'
access_denied:
  - 'C:\Windows\Prefetch'
