# Synthetic fixture host — see ../PROVENANCE.md.
# The three shapes a REG_BINARY value can have in a fixture (ADR 0022): bytes from a file under
# fixtures/, bytes written inline, and a value that is there and whose bytes cannot be read. The key
# is an invented service, not BAM: this host exercises the host crate, not a collector.
platform: windows
os_build: "26100"
elevated: false
registry:
  'HKLM\SYSTEM\CurrentControlSet\Services\fixture\State':
    from-disk:
      from: '../../parsers/bam/documented-24-byte-value.bin'
    inline:
      content: "hello\n"
    unreadable: {}
