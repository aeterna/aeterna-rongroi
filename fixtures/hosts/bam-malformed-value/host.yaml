# Synthetic fixture host — see ../PROVENANCE.md.
# One account holding a value that decodes, a value one byte short of a timestamp, and a value that
# is there and whose bytes cannot be read. Each loses one program's record and none of them gaps the
# run (ADR 0023).
platform: windows
os_build: "26100"
elevated: true
registry:
  'HKLM\SYSTEM\CurrentControlSet\Services\bam\State\UserSettings\S-1-5-21-1723019388-1114836358-2137285072-1001':
    'C:\Users\fixtureuser\Downloads\good.exe':
      from: '../../parsers/bam/documented-24-byte-value.bin'
    'C:\Users\fixtureuser\Downloads\short.exe':
      from: '../../parsers/bam/truncated.bin'
    'C:\Users\fixtureuser\Downloads\unreadable.exe': {}
