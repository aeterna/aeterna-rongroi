# Synthetic fixture host — see ../PROVENANCE.md.
#
# An elevated Windows 11 scan written before this fixture source existed: it never modelled the change
# journal at all, which the accessors report as `Unsupported`.
platform: windows
os_build: "26100"
elevated: true
env:
  SystemRoot: 'C:\Windows'
  WinDir: 'C:\Windows'
  LOCALAPPDATA: 'C:\Users\fixtureuser\AppData\Local'
  APPDATA: 'C:\Users\fixtureuser\AppData\Roaming'
