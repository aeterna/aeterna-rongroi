# Synthetic fixture host — see ../PROVENANCE.md.
#
# An elevated Windows 11 scan whose system volume journal was trimmed or replaced while the read was
# in progress: some of it was handed over and the rest cannot be.
platform: windows
os_build: "26100"
elevated: true
env:
  SystemRoot: 'C:\Windows'
  WinDir: 'C:\Windows'
  LOCALAPPDATA: 'C:\Users\fixtureuser\AppData\Local'
  APPDATA: 'C:\Users\fixtureuser\AppData\Roaming'
usn_journal:
  ends: journal_changed
  folders:
    'C:\Windows\Prefetch': 1
  records:
    - parent: 'C:\Windows\Prefetch'
      reasons: [close]
