# Synthetic fixture host — see ../PROVENANCE.md.
#
# An elevated Windows 11 scan where the Prefetch folder is unlistable, `%APPDATA%` is not set so
# Enhanced's plugin folder cannot be located, and Legacy's plugin folder is on a second volume the
# journal was not read from.
platform: windows
os_build: "26100"
elevated: true
env:
  SystemRoot: 'C:\Windows'
  WinDir: 'C:\Windows'
  LOCALAPPDATA: 'D:\Profiles\fixtureuser\AppData\Local'
access_denied:
  - 'C:\Windows\Prefetch'
usn_journal:
  folders:
    'C:\Windows\Prefetch': 1
    'C:\Windows\System32\winevt\Logs': 2
  records:
    - parent: 'C:\Windows\System32\winevt\Logs'
      reasons: [data_extend]
