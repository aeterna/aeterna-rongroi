# Synthetic fixture host — see ../PROVENANCE.md.
#
# An elevated Windows 11 scan whose system volume has no active change journal at all
# (`ERROR_JOURNAL_NOT_ACTIVE`).
platform: windows
os_build: "26100"
elevated: true
env:
  SystemRoot: 'C:\Windows'
  WinDir: 'C:\Windows'
  LOCALAPPDATA: 'C:\Users\fixtureuser\AppData\Local'
  APPDATA: 'C:\Users\fixtureuser\AppData\Roaming'
usn_journal:
  state: not_active
