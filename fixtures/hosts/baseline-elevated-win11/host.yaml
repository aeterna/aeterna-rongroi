  # ADR 0054: a hosts file of the shape measured — UTF-8 with a byte-order mark, six lines in effect,
  # none naming a listed name: one loopback, two private and three other addresses. Every name is
  # invented. The byte-order mark is written as the escape a YAML double-quoted string takes.
  'C:\Windows\System32\drivers\etc':
    - name: hosts
      content: "\uFEFF# Hosts file for a fixture PC.\r\n#\r\n# Lines added by software on this PC.\r\n\r\n127.0.0.1 local.example.test\r\n192.168.1.10 nas.home.example\r\n10.0.0.2 printer.home.example\r\n203.0.113.5 ads.example.net\r\n198.51.100.7 tracker.example.org\r\n203.0.113.9 telemetry.example.com\r\n"
  # PCA's three files, their bytes taken from the synthetic parser corpora (ADR 0019) rather than
  # written here: those files are CP-1252 with CRLF line endings, which is what the real artifact is
  # and what a YAML block scalar cannot express. Their launch dictionary records FiveM, Notepad and a
  # game executable under a Downloads folder.
  'C:\Windows\appcompat\pca':
    - name: PcaAppLaunchDic.txt
      from: '../../parsers/pca-app-launch/normal.txt'
    - name: PcaGeneralDb0.txt
      from: '../../parsers/pca-general/normal.txt'
    - name: PcaGeneralDb1.txt
      from: '../../parsers/pca-general/normal.txt'
