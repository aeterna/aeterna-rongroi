# Synthetic fixture host — see ../PROVENANCE.md.
#
# A baseline (ADR 0017): this host asserts "a machine like this is unremarkable", and
# `cargo xtask check-baseline` requires the whole rule set to stay quiet on it. It is a documented
# profile, not a machine tuned until the gate passed — changing a setting here to silence a rule would
# be changing what the project claims an ordinary PC looks like.
#
# Profile: the ordinary Windows 11 PC of somebody who plays FiveM, scanned after they accepted the
# restart-as-administrator offer (ADR 0012). Posture is `baseline-hardened-win11`'s — Secure Boot on,
# memory integrity configured on, test signing off, TPM 2.0 — and FiveM is installed with an empty
# plugin folder and a `FiveM.exe` signed as measured, as on `baseline-consumer-win11`. What this profile adds, and the reason it exists, is
# the **artifact surface**: `%WinDir%` and `%SystemRoot%` are set, as they are on every Windows
# installation, and PCA, Prefetch, the Event Log folder and the BAM state key are all present and
# readable. The other two baselines describe none of them, so on those two every rule for those four
# collectors comes out `Unmeasured` and says nothing about the rule (ADR 0026). Its driver services and
# its change-journal counts are not a PC's: both are taken from a GitHub-hosted Windows Server 2025
# runner, not from any of the Windows 11 machines this profile otherwise describes — see PROVENANCE.md.
#
# Elevation is what makes this honest rather than optimistic. This repository does not claim any of
# these four sources is readable without an elevated token — ADR 0021 and ADR 0024 say the opposite
# for Prefetch and for `Security.evtx`, and ADR 0020 and ADR 0023 record PCA and BAM as unestablished
# — so a **non-elevated** host that read them all would be a fixture asserting something nobody here
# has measured. An elevated scan reading them is the case this project is sure of, and it is the case
# an ordinary scan reaches as soon as the player takes the offer the program makes them.
#
# What each artifact holds is ordinary on purpose, including the shapes a careless rule would fire on:
# a game executable run out of a Downloads folder, `cmd.exe` with a Prefetch record, a BAM entry whose
# path is a device path. Those are the easiest false positives to write, so a baseline that left them
# out would be a weaker claim, not a safer one.
platform: windows
os_build: "26100"
elevated: true
env:
  LOCALAPPDATA: 'C:\Users\fixtureuser\AppData\Local'
  APPDATA: 'C:\Users\fixtureuser\AppData\Roaming'
  SystemRoot: 'C:\Windows'
  WinDir: 'C:\Windows'
# The change journal (ADR 0047): counts and first and last times taken from the `usn` collector's own
# reading of a GitHub-hosted Windows Server 2025 runner (windows.yml run 34930942657), rebuilt as record
# groups that give the same observations. A runner image, not a gaming PC: it asserts the collector's
# shape on a machine that is not anyone's, and says nothing about how many records an ordinary PC holds.
# Its FiveM plugin folder holds no record, because the runner has no FiveM.
usn_journal:
  maximum_size: 33554432
  trimmed: true
  folders:
    'C:\Windows\Prefetch': 1
    'C:\Windows\System32\winevt\Logs': 2
    'C:\Windows\appcompat\pca': 3
    'C:\Users\fixtureuser\AppData\Local\FiveM\FiveM.app\plugins': 4
  records:
    # winevt_logs: 733 records, 13 created, 729 data_changed, fewest groups that give those counts —
    # a record counts under both `created` and `data_changed` when it carries both reasons.
    - parent: 'C:\Windows\System32\winevt\Logs'
      reasons: [file_create, data_extend]
      count: 9
      first: '2026-09-08T01:12:16.383425Z'
      last: '2026-09-08T01:12:16.383425Z'
    - parent: 'C:\Windows\System32\winevt\Logs'
      reasons: [file_create]
      count: 4
      first: '2026-09-09T00:00:00Z'
      last: '2026-09-09T00:00:03Z'
    - parent: 'C:\Windows\System32\winevt\Logs'
      reasons: [data_extend]
      count: 720
      first: '2026-09-08T01:15:00Z'
      last: '2026-09-15T05:05:28.2865607Z'
    # The rest of the journal's 381 333 records, held by nobody this collector watches.
    - reasons: [close]
      count: 380600
      first: '2026-09-08T01:12:08.3678392Z'
      last: '2026-09-15T05:07:08.7795416Z'
registry:
  # ADR 0054: the three places `net_config` reads, in the shapes measured on one Windows 11 PC (build
  # 26220) on 2026-09-17, with invented values and value names — no rule, name or line from that PC is copied. The
  # hosts folder is the value measured there; the proxy is off as it was there; the firewall holds
  # FiveM's four rules as that PC had them (an allow-in rule for TCP and one for UDP, for FiveM.exe and
  # for GTA V Enhanced's executable inside FiveM's own folder) beside rules for other programs.
  'HKLM\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters':
    DataBasePath: '%SystemRoot%\System32\drivers\etc'
  'HKCU\Software\Microsoft\Windows\CurrentVersion\Internet Settings':
    ProxyEnable: 0
  'HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\FirewallRules':
    fixture-rule-1: 'v2.10|Action=Allow|Active=TRUE|Dir=In|Protocol=6|Profile=Private|App=C:\users\fixtureuser\appdata\local\fivem\fivem.exe|Name=fivem|Desc=fivem|Defer=User|'
    fixture-rule-2: 'v2.10|Action=Allow|Active=TRUE|Dir=In|Protocol=17|Profile=Private|App=C:\users\fixtureuser\appdata\local\fivem\fivem.exe|Name=fivem|Desc=fivem|Defer=User|'
    fixture-rule-3: 'v2.10|Action=Allow|Active=TRUE|Dir=In|Protocol=6|Profile=Private|App=C:\users\fixtureuser\appdata\local\fivem for gtav enhanced\gamecache\game\gta5_enhanced.exe|Name=gta5_enhanced|Desc=gta5_enhanced|Defer=User|'
    fixture-rule-4: 'v2.10|Action=Allow|Active=TRUE|Dir=In|Protocol=17|Profile=Private|App=C:\users\fixtureuser\appdata\local\fivem for gtav enhanced\gamecache\game\gta5_enhanced.exe|Name=gta5_enhanced|Desc=gta5_enhanced|Defer=User|'
    fixture-rule-5: 'v2.33|Action=Allow|Active=TRUE|Dir=In|Protocol=6|Profile=Domain|Profile=Private|LPort=5000|App=C:\Program Files\Example Media\player.exe|Name=Example Media|Desc=Example Media|'
    fixture-rule-6: 'v2.30|Action=Block|Active=FALSE|Dir=Out|App=%SystemRoot%\system32\example.exe|Svc=exampleservice|Name=@example.dll,-1|Desc=@example.dll,-2|'
  'HKLM\SYSTEM\CurrentControlSet\Control\SecureBoot\State':
    UEFISecureBootEnabled: 1
  'HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity':
    Enabled: 1
  # Windows' Prefetch switch at 3, application launch and boot both recorded: the value measured on a
  # Windows 11 machine (build 26220) on 2026-09-13, where it was readable without elevation (ADR 0037).
  'HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters':
    EnablePrefetcher: 3
  # One account with BAM records, in the two path shapes BAM writes: the device path it normally uses
  # (ADR 0023), which no SS-mode redaction can reach and which is therefore withheld, and a
  # drive-rooted one. The SID is invented and the collector emits no part of it. Beside them, the two
  # `REG_DWORD` values every account key held on the Windows 11 machines measured, with measured
  # numbers (../PROVENANCE.md): an ordinary machine's key holds them, so a baseline without them would
  # not be an ordinary machine's.
  'HKLM\SYSTEM\CurrentControlSet\Services\bam\State\UserSettings\S-1-5-21-1723019388-1114836358-2137285072-1001':
    Version: 1
    SequenceNumber: 115
    '\Device\HarddiskVolume3\Windows\System32\notepad.exe':
      from: '../../parsers/bam/documented-24-byte-value.bin'
    'C:\Program Files\FiveM\FiveM.exe':
      from: '../../parsers/bam/moderation-state-set.bin'
