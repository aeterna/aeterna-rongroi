# Synthetic fixture host — see ../PROVENANCE.md.
#
# A baseline (ADR 0017): this host asserts "a machine like this is unremarkable", and
# `cargo xtask check-baseline` requires the whole rule set to stay quiet on it. It is a documented
# profile, not a machine tuned until the gate passed — changing a setting here to silence a rule would
# be changing what the project claims an ordinary PC looks like.
#
# Profile: the ordinary Windows 11 PC of somebody who plays FiveM, scanned after they accepted the
# restart-as-administrator offer (ADR 0012). Posture is `baseline-hardened-win11`'s — Secure Boot on,
# memory integrity configured on, test signing off, TPM 2.0 — and FiveM is installed with an empty
# plugin folder, as on `baseline-consumer-win11`. What this profile adds, and the reason it exists, is
# the **artifact surface**: `%WinDir%` and `%SystemRoot%` are set, as they are on every Windows
# installation, and PCA, Prefetch, the Event Log folder and the BAM state key are all present and
# readable. The other two baselines describe none of them, so on those two every rule for those four
# collectors comes out `Unmeasured` and says nothing about the rule (ADR 0026).
#
# Elevation is what makes this honest rather than optimistic. This repository does not claim any of
# these four sources is readable without an elevated token — ADR 0021 and ADR 0024 say the opposite
# for Prefetch and for `Security.evtx`, and ADR 0020 and ADR 0023 record PCA and BAM as unestablished
# — so a **non-elevated** host that read them all would be a fixture asserting something nobody here
# has measured. An elevated scan reading them is the case this project is sure of, and it is the case
# an ordinary scan reaches as soon as the player takes the offer the program makes them.
#
# What each artifact holds is ordinary on purpose, including the shapes a careless rule would fire on:
# a game executable run out of a Downloads folder, `cmd.exe` with a Prefetch record, a BAM entry whose
# path is a device path. Those are the easiest false positives to write, so a baseline that left them
# out would be a weaker claim, not a safer one.
platform: windows
os_build: "26100"
elevated: true
env:
  LOCALAPPDATA: 'C:\Users\fixtureuser\AppData\Local'
  APPDATA: 'C:\Users\fixtureuser\AppData\Roaming'
  SystemRoot: 'C:\Windows'
  WinDir: 'C:\Windows'
registry:
  'HKLM\SYSTEM\CurrentControlSet\Control\SecureBoot\State':
    UEFISecureBootEnabled: 1
  'HKLM\SYSTEM\CurrentControlSet\Control\DeviceGuard\Scenarios\HypervisorEnforcedCodeIntegrity':
    Enabled: 1
  # One account with BAM records, in the two path shapes BAM writes: the device path it normally uses
  # (ADR 0023), which no SS-mode redaction can reach and which is therefore withheld, and a
  # drive-rooted one. The SID is invented and the collector emits no part of it.
  'HKLM\SYSTEM\CurrentControlSet\Services\bam\State\UserSettings\S-1-5-21-1723019388-1114836358-2137285072-1001':
    '\Device\HarddiskVolume3\Windows\System32\notepad.exe':
      from: '../../parsers/bam/documented-24-byte-value.bin'
    'C:\Program Files\FiveM\FiveM.exe':
      from: '../../parsers/bam/moderation-state-set.bin'
filesystem:
  # PCA's three files, their bytes taken from the synthetic parser corpora (ADR 0019) rather than
  # written here: those files are CP-1252 with CRLF line endings, which is what the real artifact is
  # and what a YAML block scalar cannot express. Their launch dictionary records FiveM, Notepad and a
  # game executable under a Downloads folder.
  'C:\Windows\appcompat\pca':
    - name: PcaAppLaunchDic.txt
      from: '../../parsers/pca-app-launch/normal.txt'
    - name: PcaGeneralDb0.txt
      from: '../../parsers/pca-general/normal.txt'
    - name: PcaGeneralDb1.txt
      from: '../../parsers/pca-general/normal.txt'
  # One Prefetch record — the vendored Windows 10 corpus file, for `cmd.exe` — beside the two things a
  # real Prefetch folder also holds and this collector does not read. One `.pf` file is far fewer than
  # a real folder's; see ../PROVENANCE.md for what that costs this baseline.
  'C:\Windows\Prefetch':
    - name: CMD.EXE-D269B812.pf
      from: '../../prefetch/win10-compressed-v30-CMD.EXE-D269B812.pf'
    - name: AgAppLaunch.db
      content: "not a prefetch file\n"
    - name: ReadyBoot
      directory: true
  # The one Event Log sample this repository vendors, under the file name Windows gives that channel,
  # so that the `log` this observation carries and the `channel` its records declare agree. They must:
  # a log file whose records name another channel is a file that was put there, and a baseline that
  # showed that shape would be asserting it is unremarkable.
  'C:\Windows\System32\winevt\Logs':
    - name: 'Microsoft-Windows-LanguagePackSetup%4Operational.evtx'
      from: '../../evtx/languagepacksetup-operational.evtx'
  'C:\Users\fixtureuser\AppData\Local\FiveM\FiveM.app\plugins': []
code_integrity:
  enabled: true
  test_signing: false
tpm:
  present: true
  spec_version: "2.0"
processes:
  - pid: 4
    name: System
  - pid: 1024
    name: explorer.exe
    path: 'C:\Windows\explorer.exe'
  - pid: 2048
    name: chrome.exe
    path: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
  - pid: 5120
    name: FiveM.exe
    path: 'C:\Users\fixtureuser\AppData\Local\FiveM\FiveM.exe'
