version = 1
SPDX-PackageName = "aeterna-rongroi"
SPDX-PackageSupplier = "aeterna-rongroi contributors"
SPDX-PackageDownloadLocation = "https://github.com/aeterna/aeterna-rongroi"

# Files that cannot carry a comment header, or where a header would be noise.
# Source files (.rs, .ts, .tsx, rule .yaml, workflows) carry inline SPDX headers instead.

[[annotations]]
path = [
  "**/*.md",
  "NOTICE",
  ".gitignore",
  "**/*.json",
  "**/*.snap",
  "Cargo.lock",
  "fuzz/Cargo.lock",
  # Artifact bytes: a BAM registry value or a PCA text file is the artifact and nothing else, so it
  # cannot carry a header. What they are and where they came from is in fixtures/parsers/PROVENANCE.md.
  "fixtures/parsers/**",
  "pnpm-lock.yaml",
  "apps/desktop/pnpm-lock.yaml",
  "apps/desktop/pnpm-workspace.yaml",
  "apps/desktop/src-tauri/icons/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 aeterna-rongroi contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Vendored Prefetch test corpus: binary files that cannot carry a header, under their own licence.
# Source, commit and per-file detail are in fixtures/prefetch/PROVENANCE.md.
[[annotations]]
path = ["fixtures/prefetch/*.pf"]
precedence = "override"
SPDX-FileCopyrightText = "2016 Eric Zimmerman"
SPDX-License-Identifier = "MIT"

# Vendored EVTX test corpus: the evtx crate's own samples, dual MIT/Apache-2.0 upstream, taken here
# under Apache-2.0. Source, commit, per-file detail and what each file was scanned for are in
# fixtures/evtx/PROVENANCE.md.
[[annotations]]
path = ["fixtures/evtx/*.evtx"]
precedence = "override"
SPDX-FileCopyrightText = "2019 Omer Ben-Amram"
SPDX-License-Identifier = "Apache-2.0"

# Vendored `evtx` crate source (ADR 0018): upstream's own files, carrying one patch of ours. They keep
# upstream's licence and copyright rather than this project's — a file here is Omer Ben-Amram's work,
# not ours, and relicensing it by annotation would be a false claim. What was removed and how to verify
# the rest against the published crate is in third_party/evtx/PROVENANCE.md.
[[annotations]]
path = ["third_party/evtx/**"]
precedence = "override"
SPDX-FileCopyrightText = "2019 Omer Ben-Amram"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# The rule reference pages are rule text rendered by `cargo xtask rules-reference`, so they carry the
# rules' licence rather than the documentation's.
[[annotations]]
path = ["docs/rules-reference.md", "docs/rules-reference.th.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 aeterna-rongroi contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["rules/**/tests/**", "rules/**/*.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 aeterna-rongroi contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# LOLDrivers' vulnerable-driver hashes (ADR 0048): data taken from magicsword-io/LOLDrivers under its
# licence, not this project's. The rule beside it stays CC-BY-SA-4.0. Source, commit, filter and how to
# rebuild it are in the PROVENANCE.md beside it.
[[annotations]]
path = ["rules/driver_service/vulnerable-driver/loldrivers-listed/loldrivers-vulnerable-drivers.csv"]
precedence = "override"
SPDX-FileCopyrightText = "LOLDrivers contributors"
SPDX-License-Identifier = "Apache-2.0"
