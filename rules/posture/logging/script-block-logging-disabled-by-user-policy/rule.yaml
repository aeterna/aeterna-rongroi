id: 869c34b6-7b32-4f56-a281-9f5ac00e43c4
title: A per-user policy turns Windows PowerShell script block logging off
description: >-
  A per-user policy for Windows PowerShell sets script block logging to off, and no machine policy key
  takes precedence over it. Windows ships with no such policy. With it off, Windows PowerShell run by
  that account writes none of the script blocks it runs to the Windows event log, not even the ones it
  otherwise records by itself because their content looks suspicious. That was measured on one test
  machine, not on this PC. The policy read is the one of the Windows account this scan ran as: if the
  scan was restarted with a different administrator's password, it is that administrator's policy, and
  the player's own was not read. It says nothing about which scripts ran or who set the policy. On its
  own this describes an account's settings — it is not evidence of cheating.
status: experimental
collector: posture
strength: posture
match:
  script_block_logging_user: disabled
retention: Current setting only. It says nothing about how the account was configured in the past.
unmeasured_when: [not_windows]
falsepositives:
  - PCs managed by an employer, school or other organisation whose user policy turns script block logging off, for example to keep script contents that may hold passwords out of the event log
  - A scan restarted with a different administrator's password, which reads that administrator's policy rather than the player's
  - Security or privacy baselines, debloating guides and "PC optimiser" tools that set per-user logging policies
  - A PC or account that was once managed by an organisation and still carries its policies
references:
  - https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-windowspowershell
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_group_policy_settings?view=powershell-5.1
author: aeterna-rongroi contributors
date: 2026-09-14
tags: [posture, logging]
