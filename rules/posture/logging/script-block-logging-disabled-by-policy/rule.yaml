# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
id: 88eb2aca-a33e-414d-bd0f-cfb87af95a2d
title: A machine policy turns PowerShell script block logging off
description: >-
  A machine policy for Windows PowerShell sets script block logging to off. Windows ships with no such
  policy, and a PC where nobody set one is not what this rule reports. With the policy set to off,
  PowerShell writes fewer records of the scripts it runs to the Windows event log, so a reviewer
  reading that log has less to read. It says nothing about which scripts ran or who set the policy,
  and PowerShell 7's own policy and a per-user policy are not read. On its own this describes the
  machine — it is not evidence of cheating.
status: experimental
collector: posture
strength: posture
match:
  script_block_logging: disabled
retention: Current setting only. It says nothing about how the PC was configured in the past.
# `access_denied` removed (ADR 0032, amended 2026-09-14): the `Policies\Microsoft\Windows` key above it grants Authenticated Users read and a limited-token scan was not refused, so a refused read is a changed machine a reviewer should see, not an ordinary one.
unmeasured_when: [not_windows]
falsepositives:
  - PCs managed by an employer, school or other organisation whose policy turns script block logging off, for example to keep script contents that may hold passwords out of the event log
  - Security or privacy baselines, debloating guides and "PC optimiser" tools that set Windows logging policies
  - A PC that was once managed by an organisation and still carries its policies
  - Administrators who turned it off to reduce the size of the event log
references:
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_logging?view=powershell-5.1
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_group_policy_settings?view=powershell-5.1
author: aeterna-rongroi contributors
date: 2026-09-13
tags: [posture, logging]
