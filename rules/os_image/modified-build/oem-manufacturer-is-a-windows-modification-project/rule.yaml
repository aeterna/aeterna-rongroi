# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
id: 211d278c-58de-4287-974c-dda6f39a153c
title: The OEM manufacturer shown in Settings is a Windows-modification project
description: >-
  Settings shows `Atlas Team` as the manufacturer of this PC. That is the value the Atlas playbook
    writes over the board or laptop manufacturer's own when it is applied, read from its own source
    (ADR 0056). It describes the operating system the PC runs, which a person may choose on their own
    machine, and proves nothing about cheating.
status: experimental
collector: os_image
strength: posture
match:
  oem_manufacturer: Atlas Team
retention: Current setting only. It says nothing about how the PC was configured in the past.
unmeasured_when: [not_windows, access_denied, source_absent]
falsepositives:
  - Anyone who applied the Atlas playbook for privacy, for battery life or for an old PC, and never touched a game
  - A PC bought second-hand with the playbook already applied
  - Any account with administrator rights can write this value, so it can also have been typed by hand
references:
  - https://github.com/Atlas-OS/Atlas
author: aeterna-rongroi contributors
date: 2026-09-20
tags: [posture, os_image]
