# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
id: a935bb41-6ed4-41a3-9477-7b3fe3a987d9
title: The OEM model shown in Settings names a Windows-modification playbook
description: >-
  Settings shows a device model that begins with the name one of two published Windows-modification
    playbooks writes there — Atlas or ReviOS. On an unmodified PC this value is the board or laptop
    model its manufacturer wrote (`MS-7A36` was measured on an ordinary machine), so this is the same
    statement the registered organisation makes, from the second place the playbooks write it
    (ADR 0056). It describes the operating system the PC runs and proves nothing about cheating.
status: experimental
collector: os_image
strength: posture
match:
  oem_model|startswith: ["Atlas Playbook", "ReviOS 10", "ReviOS 11"]
retention: Current setting only. It says nothing about how the PC was configured in the past.
# `access_denied` removed (ADR 0057, amending ADR 0056): a limited-token measurement on 2026-09-21 read every value this rule needs, so a refusal is a machine nobody anticipated and belongs in front of a reviewer rather than in the scope line.
unmeasured_when: [not_windows, source_absent]
falsepositives:
  - Anyone who applied one of these playbooks for privacy, for battery life or for an old PC, and never touched a game
  - A PC bought second-hand with the playbook already applied
  - Any account with administrator rights can write this value, so it can also have been typed by hand
references:
  - https://github.com/Atlas-OS/Atlas
  - https://github.com/meetrevision/playbook
author: aeterna-rongroi contributors
date: 2026-09-20
tags: [posture, os_image]
