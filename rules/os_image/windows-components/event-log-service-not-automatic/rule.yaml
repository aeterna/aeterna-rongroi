# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
id: cf83f06e-23b5-47fc-b7a0-b6d1b8192379
title: The Windows Event Log service does not start with Windows
description: >-
  The `EventLog` service is set to start on demand or never, or its key is not there at all. That
    service writes the Windows logs this program reads, so on such a machine an absent record is not
    the same statement as "nothing happened" — there may have been nothing to write it. Windows sets
    this service to start automatically, and both a stripped image and a tweaking script are known to
    change it. It describes the machine; it does not show that anything was removed or cheated.
status: experimental
collector: os_image
strength: posture
match:
  service_eventlog: [absent, disabled, manual]
retention: Current setting only. It says nothing about how the PC was configured in the past.
# `access_denied` removed (ADR 0057, amending ADR 0056): a limited-token measurement on 2026-09-21 read every value this rule needs, so a refusal is a machine nobody anticipated and belongs in front of a reviewer rather than in the scope line.
unmeasured_when: [not_windows, source_absent]
falsepositives:
  - A pre-modified Windows image installed for performance, by somebody who never touched a game
  - A tweaking script the owner ran for performance or for privacy
  - A managed build whose policy sets the service differently
references:
  - https://learn.microsoft.com/en-us/windows/win32/eventlog/event-logging
author: aeterna-rongroi contributors
date: 2026-09-20
tags: [posture, os_image]
