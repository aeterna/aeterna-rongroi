7c1f3a52-9d4e-4b8a-a6f2-3e5d9b0c41e7:
  title: Secure Boot ถูกปิดอยู่
  description: >-
    Windows รายงานว่า UEFI Secure Boot ปิดอยู่ Secure Boot อนุญาตให้เฉพาะ boot loader และ driver
    ช่วงเริ่มระบบที่มีลายเซ็นเท่านั้นทำงาน เมื่อปิดไว้ ซอฟต์แวร์ระดับล่างที่ไม่มีลายเซ็นจะโหลดได้ง่ายขึ้น
    เครื่องทั่วไปจำนวนมากก็ปิดไว้ ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตเครื่องนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - เครื่องที่บูตแบบ legacy BIOS หรือ CSM หรือไม่เคยเปิด Secure Boot มาก่อน
    - เครื่องที่ติดตั้งหลายระบบปฏิบัติการซึ่งต้องปิด Secure Boot
    - เจ้าของเครื่องปิดเองเพื่อใช้กับอุปกรณ์ เครื่องมือ virtualisation หรือการโอเวอร์คล็อก

75162c70-a6d1-47ec-94af-be25184d5ece:
  title: เปิดโหมด test signing ของ Windows อยู่
  description: >-
    Windows รายงานว่าเปิด test signing อยู่ เคอร์เนลจึงยอมโหลด driver ที่ไม่ได้เซ็นโดยผู้เผยแพร่ที่เชื่อถือได้
    รวมถึงตัวที่เซ็นเอง ทำให้การโหลดซอฟต์แวร์ระดับเคอร์เนลทุกชนิดทำได้ง่ายขึ้น ค่านี้เจ้าของเครื่องเป็นคนตั้งเอง
    และงานปกติหลายอย่างก็ต้องใช้ ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตเครื่องนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - คนที่เขียนหรือทดสอบ driver ของตัวเอง ซึ่งถือเป็นค่าปกติในการทำงาน
    - วิศวกรฮาร์ดแวร์หรือเฟิร์มแวร์ที่ใช้เครื่องมือของผู้ผลิตหรือรุ่นก่อนวางจำหน่าย
    - ซอฟต์แวร์ที่คู่มือติดตั้งของตัวเองบอกให้เจ้าของเครื่องเปิด test signing

8458638a-04fd-4bbf-910a-c4dd9bbe36bb:
  title: ตั้งค่า Memory integrity (HVCI) ไว้เป็นปิด
  description: >-
    Windows ถูกตั้งค่าไม่ให้บังคับใช้ Hypervisor-Enforced Code Integrity โค้ดระดับเคอร์เนลจึงไม่ถูกตรวจ
    ในสภาพแวดล้อมที่ hypervisor ปกป้องไว้ ข้อนี้อ่านจากค่าที่ตั้งไว้ ไม่ใช่การยืนยันสดว่า hypervisor
    กำลังบังคับใช้อยู่จริง เครื่องที่ฮาร์ดแวร์ไม่รองรับ virtualisation อาจตั้งค่าไว้อย่างไรก็ได้แต่ไม่ได้บังคับใช้อะไรเลย
    เครื่องทั่วไปจำนวนมากก็ปิดไว้ ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตเครื่องนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - เครื่องที่ฮาร์ดแวร์หรือเฟิร์มแวร์ไม่รองรับความปลอดภัยที่อาศัย virtualisation
    - เครื่องที่ปิดไว้เพื่อแก้ปัญหาชนกับ driver ระบบกันโกง หรือ virtualisation
    - เครื่องผู้ใช้ทั่วไปจำนวนมาก รวมถึงเครื่องที่อัปเกรดทับของเดิม ที่ปิดไว้เป็นค่าเริ่มต้นอยู่แล้ว

66d513b5-fe61-415a-9385-9d01f85c3ef5:
  title: เครื่องนี้ไม่มี TPM
  description: >-
    แพลตฟอร์มรายงานว่าเครื่องนี้ไม่มี TPM TPM เป็นฮาร์ดแวร์ชิ้นหนึ่งที่ใช้ผูกตัวตนได้อย่างคงที่
    การมีหรือไม่มีจึงเป็นข้อมูลประกอบที่ช่วยให้ผู้ตรวจอ่านส่วนอื่นของรายงานได้ เครื่องที่ใช้งานได้ปกติจำนวนมหาศาล
    ไม่มี TPM เลยหรือปิดไว้ในเฟิร์มแวร์ ข้อนี้จึงไม่ได้บอกอะไรเกี่ยวกับคนที่ใช้เครื่อง และไม่ใช่หลักฐานว่าโกง
  retention: เป็นสถานะฮาร์ดแวร์ตอนนี้เท่านั้น บอกไม่ได้ว่าก่อนหน้านี้ฮาร์ดแวร์หรือค่าเฟิร์มแวร์เป็นอย่างไร
  falsepositives:
    - เครื่องที่ประกอบมาโดยไม่มี TPM ซึ่งรวมถึงเครื่องรุ่นเก่าและเครื่องประกอบเองจำนวนมาก
    - TPM ที่ถูกปิดหรือซ่อนไว้ในเฟิร์มแวร์ ซึ่งเป็นค่าเริ่มต้นจากโรงงานที่พบบ่อย
    - เครื่องเสมือนและเครื่องทดสอบที่ไม่ได้ต่อ TPM เสมือนไว้

ff967b28-984b-4de0-b361-58367ae0c2d5:
  title: Security log มีบันทึกว่าตัวเองถูกล้าง
  description: >-
    Security log มีบันทึกว่าบันทึกการตรวจสอบความปลอดภัยถูกล้าง พร้อมเวลาที่เกิดขึ้น Windows เขียนบันทึกนี้
    ไม่ว่าจะตั้งค่าการตรวจสอบไว้อย่างไร จึงเป็นคำบอกเล่าของตัว log เอง แต่ไม่ได้บอกว่าใครล้าง ล้างทำไม
    หรือก่อนหน้านั้นใน log มีอะไร เครื่องมือนี้อ่านตัวไฟล์ ไม่ได้อ่านรายละเอียดในบันทึก และของที่เคยอยู่ก็หายไปแล้ว
    การล้าง log เป็นสิ่งที่เครื่องมือและผู้คนทั่วไปจำนวนมากทำกัน รายการข้างล่างนี้ไม่ใช่พิธีกรรม ให้อ่านจริง ๆ
    การล้าง Security log ยังอาจถูกบันทึกซ้ำอีกครั้งใน System log ด้วย แถวนี้กับแถว
    "มี event log ไฟล์หนึ่งถูกล้าง" จึงอาจเป็นการกระทำเดียวกัน ไม่ใช่สองเรื่อง
  retention: >-
    เห็นเฉพาะการล้างที่ยังมีบันทึกอยู่ใน Security log ณ ตอนนี้เท่านั้น log เก็บย้อนหลังได้จำกัดและเขียนทับของเก่า
    อีกทั้งการล้างครั้งหลังจะลบบันทึกของการล้างครั้งก่อนไปด้วย การไม่พบอะไรที่นี่จึงไม่ได้แปลว่าไม่เคยมีการล้าง log
  falsepositives:
    - สคริปต์ "ออปติไมซ์" "debloat" หรือ "tweak" สำหรับเกม หลายตัวที่นิยมกันล้าง log ทุกตัวในเครื่องด้วยคลิกเดียว
      ตั้งแต่หลายเดือนก่อนหน้านี้ และเจ้าของเครื่องมักลืมไปแล้วว่าเคยรัน
    - เครื่องสำเร็จรูปหรือเครื่องที่เคยส่งซ่อม ขั้นตอนทำอิมเมจจากโรงงานที่ Windows มีให้เองจะลบ event log ทิ้ง
      คนที่ล้าง log นี้จึงเป็นผู้ผลิต ไม่ใช่เจ้าของเครื่อง
    - การติดตั้งซอฟต์แวร์ที่รีเซ็ต event log ของเครื่องเป็นส่วนหนึ่งของการติดตั้ง ซึ่งโปรแกรมเฝ้าระวังและ
      โปรแกรมช่วยเหลือจากผู้ผลิตทำกันเป็นปกติ
    - เจ้าของเครื่อง ร้านคอม หรือเพื่อน กดปุ่ม "Clear Log" ใน Event Viewer ตอนไล่หาสาเหตุที่เครื่องแครช
      ซึ่งเป็นคำแนะนำมาตรฐาน และยังเลือกเก็บสำเนาไว้ก่อนล้างได้ด้วย
    - การอัปเดตฟีเจอร์ของ Windows หรือการติดตั้งทับ รวมถึงสคริปต์ดูแลเครื่องและงานตั้งเวลาที่คอยล้าง log เป็นรอบ

f4c99b57-02c8-4e53-82d0-dba8bdc13dda:
  title: มี event log ไฟล์หนึ่งถูกล้าง
  description: >-
    System log มีบันทึกว่ามีไฟล์ event log ไฟล์หนึ่งถูกล้าง พร้อมเวลาที่เกิดขึ้น Windows ระบุชื่อ log
    ที่ถูกล้างไว้ในตัวบันทึก แต่เครื่องมือนี้ไม่ได้อ่านเนื้อในของบันทึก จึงบอกไม่ได้ว่าเป็น log ตัวไหนในหลายร้อยตัวของเครื่อง
    และส่วนใหญ่ก็ไม่ใช่ตัวที่ผู้ตรวจสนใจ ตัวเลขจำนวนที่แสดงคู่กับแถวนี้คือจำนวนบันทึกแบบนี้ที่ยังเหลืออยู่
    ตัวเลขที่สูงไม่ได้แปลว่าแย่กว่า การล้าง log ทุกตัวพร้อมกันภายในวินาทีเดียวคือสิ่งที่สคริปต์ "ออปติไมซ์"
    ทำด้วยคลิกเดียว ตัวเลขที่สูงจึงเป็นหลักฐานสนับสนุนคำอธิบายนั้น ไม่ใช่หลักฐานค้าน การล้าง Security log
    อาจถูกบันทึกทั้งที่นี่และที่นั่น แถวนี้กับแถว "Security log มีบันทึกว่าตัวเองถูกล้าง"
    จึงอาจเป็นการกระทำเดียวกัน ไม่ใช่สองเรื่อง
  retention: >-
    เห็นเฉพาะการล้างที่ยังมีบันทึกอยู่ใน System log ณ ตอนนี้เท่านั้น log เก็บย้อนหลังได้จำกัดและเขียนทับของเก่า
    อีกทั้งการล้าง System log จะลบบันทึกเหล่านี้ไปพร้อมกับทุกอย่างที่เหลือ การไม่พบอะไรที่นี่จึงไม่ได้แปลว่าไม่เคยมีการล้าง log
  falsepositives:
    - สคริปต์ "ออปติไมซ์" "debloat" หรือ "tweak" สำหรับเกม หลายตัวที่นิยมกันล้าง log ทุกตัวในเครื่องด้วยคลิกเดียว
      ซึ่งเป็นเหตุผลที่ตัวเลขตรงนี้ขึ้นไปถึงหลักร้อย และเจ้าของเครื่องมักลืมไปแล้วว่าเคยรันเมื่อหลายเดือนก่อน
    - เครื่องสำเร็จรูปหรือเครื่องที่เคยส่งซ่อม ขั้นตอนทำอิมเมจจากโรงงานที่ Windows มีให้เองจะลบ event log ทิ้ง
      คนที่ล้างจึงเป็นผู้ผลิต ไม่ใช่เจ้าของเครื่อง
    - การติดตั้งซอฟต์แวร์ที่รีเซ็ต event log ของเครื่องเป็นส่วนหนึ่งของการติดตั้ง ซึ่งโปรแกรมเฝ้าระวังและ
      โปรแกรมช่วยเหลือจากผู้ผลิตทำกันเป็นปกติ
    - เจ้าของเครื่อง ร้านคอม หรือเพื่อน กดปุ่ม "Clear Log" ใน Event Viewer ตอนไล่หาสาเหตุที่เครื่องแครช
      ซึ่งเป็นคำแนะนำมาตรฐาน และยังเลือกเก็บสำเนาไว้ก่อนล้างได้ด้วย
    - การอัปเดตฟีเจอร์ของ Windows หรือการติดตั้งทับ รวมถึงสคริปต์ดูแลเครื่องและงานตั้งเวลาที่คอยล้าง log เป็นรอบ
