  title: มีไฟล์ event log ถูกตั้งเป็นอ่านอย่างเดียว
  description: >-
    มีไฟล์ในโฟลเดอร์ event log ของ Windows ที่ติด attribute อ่านอย่างเดียว (read-only) ไฟล์เหล่านี้บริการ
    Event Log ของ Windows เขียนเอง และบนเครื่อง Windows 11 เครื่องเดียวที่โครงการนี้วัดมา ไม่มีไฟล์ไหนในหลายร้อยไฟล์
    ติด attribute นี้เลย แถวนี้บอกชื่อ log แต่ไม่ได้บอกว่าใครตั้ง ตั้งเมื่อไร หรือตั้งทำไม และไม่ใช่หลักฐานว่ามีการซ่อนอะไร
  retention: >-
    เป็น attribute ณ ตอนที่สแกนเท่านั้น และดูได้เฉพาะไฟล์ log ที่ยังอยู่ในโฟลเดอร์ บอกไม่ได้ว่าถูกตั้งไว้ตั้งแต่เมื่อไร
    และบอกอะไรไม่ได้เลยเกี่ยวกับไฟล์ที่ถูกลบไปแล้ว
  falsepositives:
    - มีคนเลือก "อ่านอย่างเดียว" ในหน้า Properties ของโฟลเดอร์ event log หรือโฟลเดอร์ที่อยู่เหนือขึ้นไป ซึ่ง Windows
      จะนำไปตั้งให้กับไฟล์ข้างในทั้งหมด
    - ไฟล์ log ถูกคัดลอกหรือกู้คืนกลับเข้าโฟลเดอร์ด้วยโปรแกรมสำรองข้อมูล ทำอิมเมจ หรือคัดลอกไฟล์ที่เก็บ attribute
      ของไฟล์ไว้ด้วย อย่างที่ robocopy ของ Windows เองทำเป็นค่าเริ่มต้น

87a53c8f-b0e4-477d-91e7-93b904ba965f:
  title: มีไฟล์ event log ที่ไม่ใช่ไฟล์ที่ Windows เขียน channel ของมันลงไป
  description: >-
    บันทึกในไฟล์ log นี้เป็นของ channel ที่บริการ Event Log ของ Windows เขียนลงอีกไฟล์หนึ่ง ซึ่งแสดงชื่อไว้คู่กับแถวนี้
    Windows จึงไม่ได้เขียนอะไรเพิ่มลงไฟล์นี้แล้ว ไฟล์นี้เป็นสำเนา ไฟล์เก็บถาวร หรือ log ที่ channel ของมันถูกย้ายไปเขียนที่อื่น
    หลังจากบันทึกเหล่านี้ถูกเขียนไปแล้ว การเทียบทำเฉพาะสิ่งที่บริการระบุไว้เกี่ยวกับ channel กับไฟล์ที่อ่านมา และทำเฉพาะ
    log ที่บันทึกทั้งหมดเป็นของ channel เดียว แถวนี้ไม่ได้บอกว่าใครเอาไฟล์มาไว้ เมื่อไร หรือทำไม และไม่ใช่หลักฐานว่ามีการซ่อนอะไร
  retention: >-
    ดูได้เฉพาะไฟล์ log ที่ยังอยู่ในโฟลเดอร์ event log ของ Windows โดยเทียบกับการตั้งค่าของ Windows ณ ตอนที่สแกน
    บอกไม่ได้ว่าก่อนหน้านี้ log ถูกตั้งค่าไว้อย่างไร และบอกอะไรไม่ได้เลยเกี่ยวกับไฟล์ที่ถูกลบไปแล้ว
  falsepositives:
    - ไฟล์เก็บถาวรที่ Windows ทำเองเมื่อ log ถูกตั้งให้สำรองอัตโนมัติเมื่อเต็ม โดยจะปิดไฟล์ที่เต็มแล้วเปลี่ยนชื่อไฟล์นั้น
    - log ที่ถูกบันทึกหรือส่งออกมาไว้ในโฟลเดอร์นี้ด้วย Event Viewer หรือ wevtutil เช่น เพื่อส่งให้คนอื่นดู
    - ผู้ดูแลระบบ Group Policy หรือซอฟต์แวร์จัดการเครื่อง ย้ายที่เก็บ log ไปที่อื่น ไฟล์เดิมจึงค้างอยู่พร้อมบันทึกที่เขียนไว้ก่อนย้าย
    - log ที่ถูกคัดลอกมาจากเครื่องอื่น หรือจากไฟล์สำรอง เพื่อเปิดดู

98f6e2b8-6d23-4202-bc7f-06587ebdd2f3:
  title: ไดรเวอร์ที่ลงทะเบียนไว้อยู่ในรายชื่อไดรเวอร์มีช่องโหว่ของ LOLDrivers
  description: >-
    driver service ที่ลงทะเบียนไว้บนเครื่องนี้ชี้ไปที่ไฟล์ซึ่ง SHA-256 ตรงกับไดรเวอร์มีช่องโหว่ที่ LOLDrivers
    ยืนยันแล้ว คือไดรเวอร์ที่มีลายเซ็นแต่มีจุดอ่อนที่รู้กันอยู่ ซึ่งโปรแกรมที่รันด้วยสิทธิ์ผู้ดูแลระบบใช้รันโค้ดใน kernel
    ของ Windows ได้ Windows ยอมโหลดเพราะมีลายเซ็น แถวนี้แสดง SHA-256 ของไฟล์ ค้นหา hash นั้นใน
    rules/driver_service/vulnerable-driver/loldrivers-listed/loldrivers-vulnerable-drivers.csv ใน repository
    ของโปรแกรมนี้เพื่อดู id ของรายการใน LOLDrivers และชื่อไฟล์ ข้อนี้บอกว่าไดรเวอร์ลงทะเบียนไว้ ไม่ได้บอกว่าถูกโหลดอยู่
    ไม่ได้บอกว่ามีอะไรใช้มัน หรือทำไมถึงติดตั้งไว้ และโปรแกรมฮาร์ดแวร์ทั่วไปก็ติดตั้งไดรเวอร์แบบนี้
  falsepositives:
    - โปรแกรมโอเวอร์คล็อก ควบคุมพัดลมและไฟ RGB และโปรแกรมดูสถานะฮาร์ดแวร์ ซึ่งติดตั้งไดรเวอร์แบบนี้ รายการ RTCore64.sys ของ LOLDrivers คือไดรเวอร์ของ MSI Afterburner
    - driver service ที่ยังลงทะเบียนค้างไว้หลังถอนโปรแกรมออกแล้ว โดยไฟล์ยังอยู่บนดิสก์
  retention: driver service ที่ลงทะเบียนไว้ตอนสแกน ไดรเวอร์ที่เคยลงทะเบียนแล้วถูกลบออกก่อนสแกนจะไม่เห็น
