7c1f3a52-9d4e-4b8a-a6f2-3e5d9b0c41e7:
  title: Secure Boot ถูกปิดอยู่
  description: >-
    Windows รายงานว่า UEFI Secure Boot ปิดอยู่ Secure Boot อนุญาตให้เฉพาะ boot loader และ driver
    ช่วงเริ่มระบบที่มีลายเซ็นเท่านั้นทำงาน เมื่อปิดไว้ ซอฟต์แวร์ระดับล่างที่ไม่มีลายเซ็นจะโหลดได้ง่ายขึ้น
    เครื่องทั่วไปจำนวนมากก็ปิดไว้ ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตเครื่องนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - เครื่องที่บูตแบบ legacy BIOS หรือ CSM หรือไม่เคยเปิด Secure Boot มาก่อน
    - เครื่องที่ติดตั้งหลายระบบปฏิบัติการซึ่งต้องปิด Secure Boot
    - เจ้าของเครื่องปิดเองเพื่อใช้กับอุปกรณ์ เครื่องมือ virtualisation หรือการโอเวอร์คล็อก

75162c70-a6d1-47ec-94af-be25184d5ece:
  title: เปิดโหมด test signing ของ Windows อยู่
  description: >-
    Windows รายงานว่าเปิด test signing อยู่ เคอร์เนลจึงยอมโหลด driver ที่ไม่ได้เซ็นโดยผู้เผยแพร่ที่เชื่อถือได้
    รวมถึงตัวที่เซ็นเอง ทำให้การโหลดซอฟต์แวร์ระดับเคอร์เนลทุกชนิดทำได้ง่ายขึ้น ค่านี้เจ้าของเครื่องเป็นคนตั้งเอง
    และงานปกติหลายอย่างก็ต้องใช้ ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตเครื่องนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - คนที่เขียนหรือทดสอบ driver ของตัวเอง ซึ่งถือเป็นค่าปกติในการทำงาน
    - วิศวกรฮาร์ดแวร์หรือเฟิร์มแวร์ที่ใช้เครื่องมือของผู้ผลิตหรือรุ่นก่อนวางจำหน่าย
    - ซอฟต์แวร์ที่คู่มือติดตั้งของตัวเองบอกให้เจ้าของเครื่องเปิด test signing

8458638a-04fd-4bbf-910a-c4dd9bbe36bb:
  title: ตั้งค่า Memory integrity (HVCI) ไว้เป็นปิด
  description: >-
    Windows ถูกตั้งค่าไม่ให้บังคับใช้ Hypervisor-Enforced Code Integrity โค้ดระดับเคอร์เนลจึงไม่ถูกตรวจ
    ในสภาพแวดล้อมที่ hypervisor ปกป้องไว้ ข้อนี้อ่านจากค่าที่ตั้งไว้ ไม่ใช่การยืนยันสดว่า hypervisor
    กำลังบังคับใช้อยู่จริง เครื่องที่ฮาร์ดแวร์ไม่รองรับ virtualisation อาจตั้งค่าไว้อย่างไรก็ได้แต่ไม่ได้บังคับใช้อะไรเลย
    เครื่องทั่วไปจำนวนมากก็ปิดไว้ ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตเครื่องนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - เครื่องที่ฮาร์ดแวร์หรือเฟิร์มแวร์ไม่รองรับความปลอดภัยที่อาศัย virtualisation
    - เครื่องที่ปิดไว้เพื่อแก้ปัญหาชนกับ driver ระบบกันโกง หรือ virtualisation
    - เครื่องผู้ใช้ทั่วไปจำนวนมาก รวมถึงเครื่องที่อัปเกรดทับของเดิม ที่ปิดไว้เป็นค่าเริ่มต้นอยู่แล้ว

66d513b5-fe61-415a-9385-9d01f85c3ef5:
  title: เครื่องนี้ไม่มี TPM
  description: >-
    แพลตฟอร์มรายงานว่าเครื่องนี้ไม่มี TPM TPM เป็นฮาร์ดแวร์ชิ้นหนึ่งที่ใช้ผูกตัวตนได้อย่างคงที่
    การมีหรือไม่มีจึงเป็นข้อมูลประกอบที่ช่วยให้ผู้ตรวจอ่านส่วนอื่นของรายงานได้ เครื่องที่ใช้งานได้ปกติจำนวนมหาศาล
    ไม่มี TPM เลยหรือปิดไว้ในเฟิร์มแวร์ ข้อนี้จึงไม่ได้บอกอะไรเกี่ยวกับคนที่ใช้เครื่อง และไม่ใช่หลักฐานว่าโกง
  retention: เป็นสถานะฮาร์ดแวร์ตอนนี้เท่านั้น บอกไม่ได้ว่าก่อนหน้านี้ฮาร์ดแวร์หรือค่าเฟิร์มแวร์เป็นอย่างไร
  falsepositives:
    - เครื่องที่ประกอบมาโดยไม่มี TPM ซึ่งรวมถึงเครื่องรุ่นเก่าและเครื่องประกอบเองจำนวนมาก
    - TPM ที่ถูกปิดหรือซ่อนไว้ในเฟิร์มแวร์ ซึ่งเป็นค่าเริ่มต้นจากโรงงานที่พบบ่อย
    - เครื่องเสมือนและเครื่องทดสอบที่ไม่ได้ต่อ TPM เสมือนไว้
