7c1f3a52-9d4e-4b8a-a6f2-3e5d9b0c41e7:
  title: Secure Boot ถูกปิดอยู่
  description: >-
    Windows รายงานว่า UEFI Secure Boot ปิดอยู่ Secure Boot อนุญาตให้เฉพาะ boot loader และ driver
    ช่วงเริ่มระบบที่มีลายเซ็นเท่านั้นทำงาน เมื่อปิดไว้ ซอฟต์แวร์ระดับล่างที่ไม่มีลายเซ็นจะโหลดได้ง่ายขึ้น
    เครื่องทั่วไปจำนวนมากก็ปิดไว้ ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตเครื่องนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - เครื่องที่บูตแบบ legacy BIOS หรือ CSM หรือไม่เคยเปิด Secure Boot มาก่อน
    - เครื่องที่ติดตั้งหลายระบบปฏิบัติการซึ่งต้องปิด Secure Boot
    - เจ้าของเครื่องปิดเองเพื่อใช้กับอุปกรณ์ เครื่องมือ virtualisation หรือการโอเวอร์คล็อก

75162c70-a6d1-47ec-94af-be25184d5ece:
  title: เปิดโหมด test signing ของ Windows อยู่
  description: >-
    Windows รายงานว่าเปิด test signing อยู่ เคอร์เนลจึงยอมโหลด driver ที่ไม่ได้เซ็นโดยผู้เผยแพร่ที่เชื่อถือได้
    รวมถึงตัวที่เซ็นเอง ทำให้การโหลดซอฟต์แวร์ระดับเคอร์เนลทุกชนิดทำได้ง่ายขึ้น ค่านี้เจ้าของเครื่องเป็นคนตั้งเอง
    และงานปกติหลายอย่างก็ต้องใช้ ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตเครื่องนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - คนที่เขียนหรือทดสอบ driver ของตัวเอง ซึ่งถือเป็นค่าปกติในการทำงาน
    - วิศวกรฮาร์ดแวร์หรือเฟิร์มแวร์ที่ใช้เครื่องมือของผู้ผลิตหรือรุ่นก่อนวางจำหน่าย
    - ซอฟต์แวร์ที่คู่มือติดตั้งของตัวเองบอกให้เจ้าของเครื่องเปิด test signing

8458638a-04fd-4bbf-910a-c4dd9bbe36bb:
  title: ตั้งค่า Memory integrity (HVCI) ไว้เป็นปิด
  description: >-
    Windows ถูกตั้งค่าไม่ให้บังคับใช้ Hypervisor-Enforced Code Integrity โค้ดระดับเคอร์เนลจึงไม่ถูกตรวจ
    ในสภาพแวดล้อมที่ hypervisor ปกป้องไว้ ข้อนี้อ่านจากค่าที่ตั้งไว้ ไม่ใช่การยืนยันสดว่า hypervisor
    กำลังบังคับใช้อยู่จริง เครื่องที่ฮาร์ดแวร์ไม่รองรับ virtualisation อาจตั้งค่าไว้อย่างไรก็ได้แต่ไม่ได้บังคับใช้อะไรเลย
    เครื่องทั่วไปจำนวนมากก็ปิดไว้ ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตเครื่องนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - เครื่องที่ฮาร์ดแวร์หรือเฟิร์มแวร์ไม่รองรับความปลอดภัยที่อาศัย virtualisation
    - เครื่องที่ปิดไว้เพื่อแก้ปัญหาชนกับ driver ระบบกันโกง หรือ virtualisation
    - เครื่องผู้ใช้ทั่วไปจำนวนมาก รวมถึงเครื่องที่อัปเกรดทับของเดิม ที่ปิดไว้เป็นค่าเริ่มต้นอยู่แล้ว

66d513b5-fe61-415a-9385-9d01f85c3ef5:
  title: เครื่องนี้ไม่มี TPM
  description: >-
    แพลตฟอร์มรายงานว่าเครื่องนี้ไม่มี TPM TPM เป็นฮาร์ดแวร์ชิ้นหนึ่งที่ใช้ผูกตัวตนได้อย่างคงที่
    การมีหรือไม่มีจึงเป็นข้อมูลประกอบที่ช่วยให้ผู้ตรวจอ่านส่วนอื่นของรายงานได้ เครื่องที่ใช้งานได้ปกติจำนวนมหาศาล
    ไม่มี TPM เลยหรือปิดไว้ในเฟิร์มแวร์ ข้อนี้จึงไม่ได้บอกอะไรเกี่ยวกับคนที่ใช้เครื่อง และไม่ใช่หลักฐานว่าโกง
  retention: เป็นสถานะฮาร์ดแวร์ตอนนี้เท่านั้น บอกไม่ได้ว่าก่อนหน้านี้ฮาร์ดแวร์หรือค่าเฟิร์มแวร์เป็นอย่างไร
  falsepositives:
    - เครื่องที่ประกอบมาโดยไม่มี TPM ซึ่งรวมถึงเครื่องรุ่นเก่าและเครื่องประกอบเองจำนวนมาก
    - TPM ที่ถูกปิดหรือซ่อนไว้ในเฟิร์มแวร์ ซึ่งเป็นค่าเริ่มต้นจากโรงงานที่พบบ่อย
    - เครื่องเสมือนและเครื่องทดสอบที่ไม่ได้ต่อ TPM เสมือนไว้

5ec56c3d-da70-4acc-99d6-2c41c0b75d71:
  title: เฟิร์มแวร์รายงานว่า Secure Boot ปิด แต่ Windows รายงานว่าเปิด
  description: >-
    Secure Boot ถูกอ่านจากสองที่ registry ของ Windows บอกว่าเปิดอยู่ แต่ตัวแปร Secure Boot ของเฟิร์มแวร์เอง
    บอกว่าปิด เฟิร์มแวร์เป็นตัวตัดสินว่า Secure Boot ถูกบังคับใช้หรือไม่ ตราบใดที่สองค่านี้ไม่ตรงกัน ค่าใน registry
    จึงไม่ได้บอกว่าเครื่องนี้เริ่มระบบมาอย่างไร โปรแกรมนี้บอกไม่ได้ว่าทำไมสองค่าถึงต่างกัน หรือค่าไหนเปลี่ยนทีหลัง
    การอ่านเฟิร์มแวร์ต้องใช้สิทธิ์ผู้ดูแลระบบ การสแกนที่ไม่มีสิทธิ์นี้จึงตอบข้อนี้ไม่ได้
    ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: >-
    เป็นสถานะตอนนี้เท่านั้น คือสิ่งที่เฟิร์มแวร์รายงานสำหรับการเปิด Windows ครั้งนี้ และค่าที่อยู่ใน registry ตอนนี้
    บอกไม่ได้ว่าการเปิดเครื่องครั้งก่อน ๆ เป็นอย่างไร
  falsepositives:
    - เครื่องเสมือน ซึ่งเฟิร์มแวร์เสมือนอาจรายงาน Secure Boot ต่างจากที่ Windows บันทึกไว้
    - เฟิร์มแวร์ที่รายงาน Secure Boot ไม่สม่ำเสมอ เช่น หลังอัปเดตเฟิร์มแวร์ หรือหลังรีเซ็ตคีย์ Secure Boot
    - Windows หรือดิสก์ที่ย้ายมาใช้กับฮาร์ดแวร์อื่น หรือมีการเปลี่ยน Secure Boot ในหน้าตั้งค่าเฟิร์มแวร์ โดยที่ Windows
      ยังไม่ได้เขียนสถานะใหม่ลง registry

88eb2aca-a33e-414d-bd0f-cfb87af95a2d:
  title: นโยบายระดับเครื่องปิดการบันทึก script block ของ Windows PowerShell
  description: >-
    นโยบายระดับเครื่องของ Windows PowerShell ซึ่งคือ powershell.exe ที่มากับ Windows ตั้งให้ปิดการบันทึก script block
    Windows ไม่ได้มีนโยบายนี้มาตั้งแต่แรก และเครื่องที่ไม่มีใครตั้งนโยบายนี้ไว้ไม่ใช่สิ่งที่ข้อนี้รายงาน เมื่อนโยบายตั้งเป็นปิด
    Windows PowerShell จะไม่เขียน script block ที่รันลง event log ของ Windows เลย แม้แต่ส่วนที่ปกติจะบันทึกเองเพราะเนื้อหาดูน่าสงสัย
    ผู้ตรวจที่อ่าน log นั้นจึงมีข้อมูลให้อ่านน้อยลง สิ่งนี้วัดบนเครื่องทดสอบเครื่องเดียว ไม่ได้วัดบนเครื่องนี้
    ข้อนี้ไม่ได้บอกว่าสคริปต์ไหนเคยรันหรือใครเป็นคนตั้งนโยบาย นโยบายระดับผู้ใช้และนโยบายของ PowerShell 7 มีข้อของตัวเองแยกไว้
    ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตเครื่องนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - เครื่องที่บริษัท โรงเรียน หรือองค์กรอื่นดูแล และนโยบายขององค์กรปิดการบันทึกนี้ เช่น เพื่อไม่ให้เนื้อหาสคริปต์
      ที่อาจมีรหัสผ่านไปอยู่ใน event log
    - ชุดค่าความปลอดภัยหรือความเป็นส่วนตัว คู่มือ debloat และโปรแกรม "เร่งความเร็วเครื่อง" ที่ตั้งนโยบายการบันทึกของ Windows
    - เครื่องที่เคยอยู่ภายใต้การดูแลขององค์กรและยังมีนโยบายเดิมค้างอยู่
    - ผู้ดูแลเครื่องที่ปิดไว้เพื่อลดขนาดของ event log

869c34b6-7b32-4f56-a281-9f5ac00e43c4:
  title: นโยบายระดับผู้ใช้ปิดการบันทึก script block ของ Windows PowerShell
  description: >-
    นโยบายระดับผู้ใช้ของ Windows PowerShell ตั้งให้ปิดการบันทึก script block และไม่มี key นโยบายระดับเครื่องที่มาก่อน
    Windows ไม่ได้มีนโยบายนี้มาตั้งแต่แรก เมื่อตั้งเป็นปิด Windows PowerShell ที่บัญชีนั้นรันจะไม่เขียน script block ที่รันลง
    event log ของ Windows เลย แม้แต่ส่วนที่ปกติจะบันทึกเองเพราะเนื้อหาดูน่าสงสัย สิ่งนี้วัดบนเครื่องทดสอบเครื่องเดียว
    ไม่ได้วัดบนเครื่องนี้ นโยบายที่อ่านคือของบัญชี Windows ที่ใช้รันการสแกนนี้ ถ้าการสแกนถูกเริ่มใหม่ด้วยรหัสผ่านของผู้ดูแลระบบคนอื่น
    จะเป็นนโยบายของผู้ดูแลคนนั้น และไม่ได้อ่านของผู้เล่นเอง ข้อนี้ไม่ได้บอกว่าสคริปต์ไหนเคยรันหรือใครเป็นคนตั้งนโยบาย
    ข้อนี้อย่างเดียวจึงบอกการตั้งค่าของบัญชี ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตบัญชีนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - เครื่องที่บริษัท โรงเรียน หรือองค์กรอื่นดูแล และนโยบายระดับผู้ใช้ขององค์กรปิดการบันทึกนี้ เช่น
      เพื่อไม่ให้เนื้อหาสคริปต์ที่อาจมีรหัสผ่านไปอยู่ใน event log
    - การสแกนที่เริ่มใหม่ด้วยรหัสผ่านของผู้ดูแลระบบคนอื่น ซึ่งอ่านนโยบายของผู้ดูแลคนนั้นแทนของผู้เล่น
    - ชุดค่าความปลอดภัยหรือความเป็นส่วนตัว คู่มือ debloat และโปรแกรม "เร่งความเร็วเครื่อง" ที่ตั้งนโยบายการบันทึกระดับผู้ใช้
    - เครื่องหรือบัญชีที่เคยอยู่ภายใต้การดูแลขององค์กรและยังมีนโยบายเดิมค้างอยู่

98ee9213-39f3-4219-b2ac-f2bb3d21d6cc:
  title: นโยบายระดับเครื่องปิดการบันทึก script block ของ PowerShell 7
  description: >-
    นโยบายระดับเครื่องของ PowerShell 7 ซึ่งคือ pwsh.exe ที่ติดตั้งแยกจาก Windows ตั้งให้ปิดการบันทึก script block
    จะตั้งไว้ในนโยบายของ PowerShell 7 เอง หรือในนโยบายของ Windows PowerShell เมื่อนโยบายของ PowerShell 7 บอกให้ใช้ของนั้นก็ได้
    Windows ไม่ได้มีนโยบายนี้มาตั้งแต่แรก เมื่อตั้งเป็นปิด PowerShell 7 จะไม่เขียน script block ที่รันลง event log ของตัวเองเลย
    แม้แต่ส่วนที่ปกติจะบันทึกเองเพราะเนื้อหาดูน่าสงสัย สิ่งนี้วัดบนเครื่องทดสอบเครื่องเดียว ไม่ได้วัดบนเครื่องนี้
    ข้อนี้ไม่ได้อ่านว่าเครื่องนี้ติดตั้ง PowerShell 7 ไว้หรือไม่ และไม่ได้อ่านไฟล์ตั้งค่าของ PowerShell 7
    ข้อนี้ไม่ได้บอกว่าสคริปต์ไหนเคยรันหรือใครเป็นคนตั้งนโยบาย ข้อนี้อย่างเดียวจึงบอกลักษณะของเครื่อง ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตเครื่องนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - เครื่องที่บริษัท โรงเรียน หรือองค์กรอื่นดูแล และนโยบายขององค์กรปิดการบันทึกนี้ เช่น เพื่อไม่ให้เนื้อหาสคริปต์
      ที่อาจมีรหัสผ่านไปอยู่ใน event log
    - นโยบายของ PowerShell 7 ที่บอกให้ใช้ค่าของ Windows PowerShell บนเครื่องที่นโยบายของ Windows PowerShell ปิดไว้
      ค่าเดียวกันนั้นจึงแสดงในทั้งสองข้อ
    - ชุดค่าความปลอดภัยหรือความเป็นส่วนตัว คู่มือ debloat และโปรแกรม "เร่งความเร็วเครื่อง" ที่ตั้งนโยบายการบันทึก
    - นโยบายที่ค้างอยู่บนเครื่องที่ไม่ได้ติดตั้ง PowerShell 7 หรือค้างจากการดูแลขององค์กรในอดีต

e9f05cfb-6618-42ca-b4bf-f57f2e9ba8c7:
  title: นโยบายระดับผู้ใช้ปิดการบันทึก script block ของ PowerShell 7
  description: >-
    นโยบายระดับผู้ใช้ของ PowerShell 7 ซึ่งคือ pwsh.exe ที่ติดตั้งแยกจาก Windows ตั้งให้ปิดการบันทึก script block
    จะตั้งไว้ในนโยบายของ PowerShell 7 เอง หรือในนโยบายของ Windows PowerShell เมื่อนโยบายของ PowerShell 7 บอกให้ใช้ของนั้นก็ได้
    และไม่มีนโยบายระดับเครื่องที่มาก่อน Windows ไม่ได้มีนโยบายนี้มาตั้งแต่แรก เมื่อตั้งเป็นปิด PowerShell 7 ที่บัญชีนั้นรัน
    จะไม่เขียน script block ที่รันลง event log ของตัวเองเลย แม้แต่ส่วนที่ปกติจะบันทึกเองเพราะเนื้อหาดูน่าสงสัย
    สิ่งนี้วัดบนเครื่องทดสอบเครื่องเดียว ไม่ได้วัดบนเครื่องนี้ นโยบายที่อ่านคือของบัญชี Windows ที่ใช้รันการสแกนนี้
    ถ้าการสแกนถูกเริ่มใหม่ด้วยรหัสผ่านของผู้ดูแลระบบคนอื่น จะเป็นนโยบายของผู้ดูแลคนนั้น ข้อนี้ไม่ได้อ่านว่าเครื่องนี้ติดตั้ง PowerShell 7
    ไว้หรือไม่ และไม่ได้บอกว่าสคริปต์ไหนเคยรันหรือใครเป็นคนตั้งนโยบาย ข้อนี้อย่างเดียวจึงบอกการตั้งค่าของบัญชี ไม่ใช่หลักฐานว่าโกง
  retention: เป็นค่าที่ตั้งไว้ตอนนี้เท่านั้น บอกไม่ได้ว่าในอดีตบัญชีนี้เคยตั้งค่าไว้อย่างไร
  falsepositives:
    - เครื่องที่บริษัท โรงเรียน หรือองค์กรอื่นดูแล และนโยบายระดับผู้ใช้ขององค์กรปิดการบันทึกนี้ เช่น
      เพื่อไม่ให้เนื้อหาสคริปต์ที่อาจมีรหัสผ่านไปอยู่ใน event log
    - การสแกนที่เริ่มใหม่ด้วยรหัสผ่านของผู้ดูแลระบบคนอื่น ซึ่งอ่านนโยบายของผู้ดูแลคนนั้นแทนของผู้เล่น
    - นโยบายของ PowerShell 7 ที่บอกให้ใช้ค่าของ Windows PowerShell สำหรับบัญชีที่นโยบายระดับผู้ใช้ของ Windows PowerShell ปิดไว้
      ค่าเดียวกันนั้นจึงอาจแสดงในข้อระดับผู้ใช้ของ Windows PowerShell ด้วย
    - ชุดค่าความปลอดภัยหรือความเป็นส่วนตัว คู่มือ debloat และโปรแกรม "เร่งความเร็วเครื่อง" ที่ตั้งนโยบายการบันทึก
      หรือนโยบายที่ค้างจากการดูแลในอดีต หรือค้างอยู่บนเครื่องที่ไม่ได้ติดตั้ง PowerShell 7

ff967b28-984b-4de0-b361-58367ae0c2d5:
  title: Security log มีบันทึกว่าตัวเองถูกล้าง
  description: >-
    Security log มีบันทึกว่าบันทึกการตรวจสอบความปลอดภัยถูกล้าง พร้อมเวลาที่เกิดขึ้น Windows เขียนบันทึกนี้
    ไม่ว่าจะตั้งค่าการตรวจสอบไว้อย่างไร จึงเป็นคำบอกเล่าของตัว log เอง แต่ไม่ได้บอกว่าใครล้าง ล้างทำไม
    หรือก่อนหน้านั้นใน log มีอะไร เครื่องมือนี้อ่านตัวไฟล์ ไม่ได้อ่านรายละเอียดในบันทึก และของที่เคยอยู่ก็หายไปแล้ว
    การล้าง log เป็นสิ่งที่เครื่องมือและผู้คนทั่วไปจำนวนมากทำกัน รายการข้างล่างนี้ไม่ใช่พิธีกรรม ให้อ่านจริง ๆ
    การล้าง Security log ยังอาจถูกบันทึกซ้ำอีกครั้งใน System log ด้วย แถวนี้กับแถว
    "มี event log ไฟล์หนึ่งถูกล้าง" จึงอาจเป็นการกระทำเดียวกัน ไม่ใช่สองเรื่อง
  retention: >-
    เห็นเฉพาะการล้างที่ยังมีบันทึกอยู่ใน Security log ณ ตอนนี้เท่านั้น log เก็บย้อนหลังได้จำกัดและเขียนทับของเก่า
    อีกทั้งการล้างครั้งหลังจะลบบันทึกของการล้างครั้งก่อนไปด้วย การไม่พบอะไรที่นี่จึงไม่ได้แปลว่าไม่เคยมีการล้าง log
  falsepositives:
    - สคริปต์ "ออปติไมซ์" "debloat" หรือ "tweak" สำหรับเกม หลายตัวที่นิยมกันล้าง log ทุกตัวในเครื่องด้วยคลิกเดียว
      ตั้งแต่หลายเดือนก่อนหน้านี้ และเจ้าของเครื่องมักลืมไปแล้วว่าเคยรัน
    - เครื่องสำเร็จรูปหรือเครื่องที่เคยส่งซ่อม ขั้นตอนทำอิมเมจจากโรงงานที่ Windows มีให้เองจะลบ event log ทิ้ง
      คนที่ล้าง log นี้จึงเป็นผู้ผลิต ไม่ใช่เจ้าของเครื่อง
    - การติดตั้งซอฟต์แวร์ที่รีเซ็ต event log ของเครื่องเป็นส่วนหนึ่งของการติดตั้ง ซึ่งโปรแกรมเฝ้าระวังและ
      โปรแกรมช่วยเหลือจากผู้ผลิตทำกันเป็นปกติ
    - เจ้าของเครื่อง ร้านคอม หรือเพื่อน กดปุ่ม "Clear Log" ใน Event Viewer ตอนไล่หาสาเหตุที่เครื่องแครช
      ซึ่งเป็นคำแนะนำมาตรฐาน และยังเลือกเก็บสำเนาไว้ก่อนล้างได้ด้วย
    - การอัปเดตฟีเจอร์ของ Windows หรือการติดตั้งทับ รวมถึงสคริปต์ดูแลเครื่องและงานตั้งเวลาที่คอยล้าง log เป็นรอบ

f4c99b57-02c8-4e53-82d0-dba8bdc13dda:
  title: มี event log ไฟล์หนึ่งถูกล้าง
  description: >-
    System log มีบันทึกว่ามีไฟล์ event log ไฟล์หนึ่งถูกล้าง พร้อมเวลาที่เกิดขึ้น Windows ระบุชื่อ log
    ที่ถูกล้างไว้ในตัวบันทึก แต่เครื่องมือนี้ไม่ได้อ่านเนื้อในของบันทึก จึงบอกไม่ได้ว่าเป็น log ตัวไหนในหลายร้อยตัวของเครื่อง
    และส่วนใหญ่ก็ไม่ใช่ตัวที่ผู้ตรวจสนใจ ตัวเลขจำนวนที่แสดงคู่กับแถวนี้คือจำนวนบันทึกแบบนี้ที่ยังเหลืออยู่
    ตัวเลขที่สูงไม่ได้แปลว่าแย่กว่า การล้าง log ทุกตัวพร้อมกันภายในวินาทีเดียวคือสิ่งที่สคริปต์ "ออปติไมซ์"
    ทำด้วยคลิกเดียว ตัวเลขที่สูงจึงเป็นหลักฐานสนับสนุนคำอธิบายนั้น ไม่ใช่หลักฐานค้าน การล้าง Security log
    อาจถูกบันทึกทั้งที่นี่และที่นั่น แถวนี้กับแถว "Security log มีบันทึกว่าตัวเองถูกล้าง"
    จึงอาจเป็นการกระทำเดียวกัน ไม่ใช่สองเรื่อง
  retention: >-
    เห็นเฉพาะการล้างที่ยังมีบันทึกอยู่ใน System log ณ ตอนนี้เท่านั้น log เก็บย้อนหลังได้จำกัดและเขียนทับของเก่า
    อีกทั้งการล้าง System log จะลบบันทึกเหล่านี้ไปพร้อมกับทุกอย่างที่เหลือ การไม่พบอะไรที่นี่จึงไม่ได้แปลว่าไม่เคยมีการล้าง log
  falsepositives:
    - สคริปต์ "ออปติไมซ์" "debloat" หรือ "tweak" สำหรับเกม หลายตัวที่นิยมกันล้าง log ทุกตัวในเครื่องด้วยคลิกเดียว
      ซึ่งเป็นเหตุผลที่ตัวเลขตรงนี้ขึ้นไปถึงหลักร้อย และเจ้าของเครื่องมักลืมไปแล้วว่าเคยรันเมื่อหลายเดือนก่อน
    - เครื่องสำเร็จรูปหรือเครื่องที่เคยส่งซ่อม ขั้นตอนทำอิมเมจจากโรงงานที่ Windows มีให้เองจะลบ event log ทิ้ง
      คนที่ล้างจึงเป็นผู้ผลิต ไม่ใช่เจ้าของเครื่อง
    - การติดตั้งซอฟต์แวร์ที่รีเซ็ต event log ของเครื่องเป็นส่วนหนึ่งของการติดตั้ง ซึ่งโปรแกรมเฝ้าระวังและ
      โปรแกรมช่วยเหลือจากผู้ผลิตทำกันเป็นปกติ
    - เจ้าของเครื่อง ร้านคอม หรือเพื่อน กดปุ่ม "Clear Log" ใน Event Viewer ตอนไล่หาสาเหตุที่เครื่องแครช
      ซึ่งเป็นคำแนะนำมาตรฐาน และยังเลือกเก็บสำเนาไว้ก่อนล้างได้ด้วย
    - การอัปเดตฟีเจอร์ของ Windows หรือการติดตั้งทับ รวมถึงสคริปต์ดูแลเครื่องและงานตั้งเวลาที่คอยล้าง log เป็นรอบ

061797d3-161d-4783-89e6-caf658973436:
  title: มีไฟล์ในโฟลเดอร์ plugins ของ FiveM ที่ไม่มีลายเซ็นฝังในไฟล์ซึ่งตรวจผ่านบนเครื่องนี้
  description: >-
    โฟลเดอร์ plugins ของ FiveM for GTA V Legacy (%LOCALAPPDATA%\FiveM\FiveM.app\plugins) มีไฟล์อยู่ และ
    Windows พบว่าไฟล์นั้นไม่มีลายเซ็นฝังอยู่ หรือมีแต่ตรวจไม่ผ่าน หรือตรวจไม่ได้ถ้าไม่ต่ออินเทอร์เน็ต
    แต่ละไฟล์ที่แสดงจะบอกว่าเป็นกรณีไหน "ตรวจไม่ได้ถ้าไม่ต่ออินเทอร์เน็ต" รวมถึงสายใบรับรองที่ไปจบที่ใบรับรองราก (root)
    ซึ่งเครื่องนี้ไม่ได้ถือไว้ว่าเชื่อถือได้ ถ้าไม่ต่ออินเทอร์เน็ตจะแยกกรณีนี้ออกจากใบรับรองรากที่ไม่มีใครเชื่อถือไม่ได้
    ลายเซ็นที่เซ็นด้วยใบรับรองที่ออกให้ตัวเอง (self-signed) ก็ออกมาแบบนี้เช่นกัน โฟลเดอร์นี้คือที่ที่คู่มือบนฟอรัม Cfx.re เองบอกให้ผู้เล่นใส่ม็อดกราฟิกอย่าง
    ReShade ไฟล์ในนี้จึงเป็นม็อดพวกนั้น ไฟล์ตั้งค่า หรือไฟล์ log ของมัน ได้บ่อยพอ ๆ กับเป็นอย่างอื่น
    ข้อนี้ไม่ได้บอกว่าไฟล์คืออะไร ทำอะไร เคยถูกโหลดหรือไม่ หรือใครเป็นคนใส่ไว้ ไฟล์ที่มีลายเซ็นถูกต้องจะแสดงอยู่ใต้
    "มีไฟล์ในโฟลเดอร์ plugins ของ FiveM ที่มีลายเซ็นฝังในไฟล์ซึ่งถูกต้อง" และไฟล์ที่ตรวจลายเซ็นไม่ได้เลยจะแสดงอยู่ใต้
    "ตรวจลายเซ็นของไฟล์ FiveM ไม่ได้" ไม่ใช่ที่นี่ ผล "ไม่พบ" ของแถวนี้จึงพูดแทนได้เฉพาะไฟล์ที่ตรวจลายเซ็นได้แล้วเท่านั้น
  retention: >-
    เห็นเฉพาะไฟล์ที่อยู่ในโฟลเดอร์ตอนที่สแกนเท่านั้น ไฟล์ที่ถูกลบไปก่อนหน้านั้นไม่เหลือร่องรอยที่นี่
    และข้อนี้บอกไม่ได้ว่าก่อนหน้านี้ในโฟลเดอร์เคยมีอะไร
  falsepositives:
    - ม็อดกราฟิก เช่น dxgi.dll หรือ d3d11.dll ของ ReShade หรือ ENB ที่ติดตั้งไว้ที่นี่ตามคู่มือบนฟอรัม Cfx.re
      ม็อดหลายตัวผู้สร้างไม่ได้เซ็นไว้เลย
    - ไฟล์ตั้งค่า ไฟล์ preset และไฟล์ log ที่ม็อดเหล่านั้นเก็บไว้ข้างตัว (ReShade.ini, ไฟล์ .ini ของ preset,
      ReShade.log) ซึ่งเป็นไฟล์ข้อความ ไม่ใช่โปรแกรม และไฟล์ข้อความไม่มีลายเซ็นฝังในไฟล์เลย
    - overlay ตัวนับ FPS และเครื่องมือเพิ่มประสิทธิภาพหรืออัดหน้าจอที่ติดตั้ง plugin ไว้ที่นี่
    - ลายเซ็นที่ตรวจไม่ผ่านเพราะไฟล์เสียระหว่างดาวน์โหลดหรือจากดิสก์มีปัญหา หรือเพราะใบรับรองที่ใช้เซ็นหมดอายุ
      โดยไม่มีการประทับเวลา
    - ลายเซ็นที่เครื่องนี้ตรวจแบบออฟไลน์ไม่ได้ เพราะสายใบรับรองต้องใช้ข้อมูลที่ Windows ยังไม่ได้เก็บไว้
      เช่นใบรับรองราก และข้อนี้ไม่เคยออกอินเทอร์เน็ตไปดึงมา

d5531c55-1a65-4698-9f39-7cf79bbbb7ba:
  title: มีไฟล์ในโฟลเดอร์ plugins ของ FiveM ที่มีลายเซ็นฝังในไฟล์ซึ่งถูกต้อง
  description: >-
    โฟลเดอร์ plugins ของ FiveM for GTA V Legacy (%LOCALAPPDATA%\FiveM\FiveM.app\plugins) มีไฟล์ที่มีลายเซ็นฝังอยู่
    และ Windows ตรวจแล้วถูกต้อง แถวนี้แสดงชื่อผู้เซ็นและ SHA-256 ของใบรับรองที่ใช้เซ็น ลายเซ็นที่ถูกต้องบอกว่าใครเซ็น
    และไฟล์ไม่ถูกแก้ตั้งแต่ตอนนั้น แต่ไม่ได้บอกว่าไฟล์ทำอะไร หรือควรอยู่ตรงนี้ เคยมีใบรับรองที่ถูกขโมยจากบริษัทจริง
    แล้วเอาไปเซ็นโปรแกรมโกงและมัลแวร์ในชื่อบริษัทนั้น และข้อนี้ไม่ได้ตรวจการเพิกถอนใบรับรอง ชื่อผู้เซ็นมีไว้ให้ผู้อ่านไปค้นต่อ
    แยกเป็นคนละแถวกับไฟล์ที่ไม่มีลายเซ็นซึ่งตรวจผ่าน เพราะสิ่งที่ผู้ตรวจทำต่อได้ไม่เหมือนกัน ข้อนี้ไม่ได้บอกว่าไฟล์เคยถูกโหลดหรือไม่
  retention: >-
    เห็นเฉพาะไฟล์ที่อยู่ในโฟลเดอร์ตอนที่สแกนเท่านั้น ไฟล์ที่ถูกลบไปก่อนหน้านั้นไม่เหลือร่องรอยที่นี่
    และข้อนี้บอกไม่ได้ว่าก่อนหน้านี้ในโฟลเดอร์เคยมีอะไร
  falsepositives:
    - overlay เครื่องมืออัดหน้าจอ และเครื่องมือเพิ่มประสิทธิภาพจากผู้ผลิตที่เป็นที่รู้จัก ซึ่งติดตั้ง plugin ที่เซ็นแล้วไว้ที่นี่
    - ม็อดกราฟิกรุ่นที่เซ็นแล้ว ติดตั้งไว้ที่นี่ตามคู่มือบนฟอรัม Cfx.re
    - ซอฟต์แวร์ที่นักพัฒนาเซ็นในนามตัวเอง ใบรับรองจึงเป็นชื่อจริงของคนคนนั้น

0999422f-8709-4d85-80e3-39410a85ed6b:
  title: มีไฟล์ในโฟลเดอร์ asi ของ FiveM for GTA V Enhanced ที่ไม่มีลายเซ็นฝังในไฟล์ซึ่งตรวจผ่านบนเครื่องนี้
  description: >-
    โฟลเดอร์ %APPDATA%\FiveM for GTAV Enhanced\gta5enhanced\asi ของ FiveM for GTA V Enhanced มีไฟล์อยู่ และ
    Windows พบว่าไฟล์นั้นไม่มีลายเซ็นฝังอยู่ หรือมีแต่ตรวจไม่ผ่าน หรือตรวจไม่ได้ถ้าไม่ต่ออินเทอร์เน็ต
    แต่ละไฟล์ที่แสดงจะบอกว่าเป็นกรณีไหน "ตรวจไม่ได้ถ้าไม่ต่ออินเทอร์เน็ต" รวมถึงสายใบรับรองที่ไปจบที่ใบรับรองราก (root)
    ซึ่งเครื่องนี้ไม่ได้ถือไว้ว่าเชื่อถือได้ ถ้าไม่ต่ออินเทอร์เน็ตจะแยกกรณีนี้ออกจากใบรับรองรากที่ไม่มีใครเชื่อถือไม่ได้
    ลายเซ็นที่เซ็นด้วยใบรับรองที่ออกให้ตัวเอง (self-signed) ก็ออกมาแบบนี้เช่นกัน ยังไม่มีข้อยืนยันว่าตัว Enhanced โหลดอะไรจากโฟลเดอร์นี้หรือไม่
    รู้แค่ว่าโฟลเดอร์นี้มีอยู่ตั้งแต่ติดตั้งใหม่และตั้งชื่อตาม plugin แบบ ASI ไฟล์ที่อยู่ในนี้จึงเป็นแค่ไฟล์ในโฟลเดอร์นี้
    ไม่มีความหมายมากกว่านั้น ข้อนี้ไม่ได้บอกว่าไฟล์คืออะไร ทำอะไร หรือใครเป็นคนใส่ไว้ ไฟล์ที่มีลายเซ็นถูกต้องจะแสดงอยู่ใต้
    "มีไฟล์ในโฟลเดอร์ asi ของ FiveM for GTA V Enhanced ที่มีลายเซ็นฝังในไฟล์ซึ่งถูกต้อง" และไฟล์ที่ตรวจลายเซ็นไม่ได้เลย
    จะแสดงอยู่ใต้ "ตรวจลายเซ็นของไฟล์ FiveM ไม่ได้"
  retention: >-
    เห็นเฉพาะไฟล์ที่อยู่ในโฟลเดอร์ตอนที่สแกนเท่านั้น ไฟล์ที่ถูกลบไปก่อนหน้านั้นไม่เหลือร่องรอยที่นี่
    และข้อนี้บอกไม่ได้ว่าก่อนหน้านี้ในโฟลเดอร์เคยมีอะไร
  falsepositives:
    - ม็อดกราฟิกพร้อมไฟล์ตั้งค่าหรือไฟล์ log ที่ผู้เล่นใส่ไว้ตามคู่มือที่เขียนสำหรับเกมอื่น หรือสำหรับโฟลเดอร์
      plugins ของ Legacy
    - ไฟล์ข้อความทุกชนิด เช่น readme ไฟล์ .ini หรือไฟล์ log ซึ่งไม่มีลายเซ็นฝังในไฟล์เลย
    - เครื่องมือที่ติดตั้งไฟล์ไว้ที่นี่สำหรับรุ่น Enhanced ไม่ว่าผู้สร้างจะเซ็นไว้หรือไม่
    - ลายเซ็นที่ตรวจไม่ผ่านเพราะไฟล์เสีย หรือใบรับรองหมดอายุโดยไม่มีการประทับเวลา
    - ลายเซ็นที่เครื่องนี้ตรวจแบบออฟไลน์ไม่ได้ เพราะสายใบรับรองต้องใช้ข้อมูลที่ Windows ยังไม่ได้เก็บไว้
      เช่นใบรับรองราก

53528a11-5af7-4e75-94bf-fca07eec6fcc:
  title: มีไฟล์ในโฟลเดอร์ asi ของ FiveM for GTA V Enhanced ที่มีลายเซ็นฝังในไฟล์ซึ่งถูกต้อง
  description: >-
    โฟลเดอร์ %APPDATA%\FiveM for GTAV Enhanced\gta5enhanced\asi ของ FiveM for GTA V Enhanced มีไฟล์ที่มีลายเซ็น
    ฝังอยู่และ Windows ตรวจแล้วถูกต้อง แถวนี้แสดงชื่อผู้เซ็นและ SHA-256 ของใบรับรองที่ใช้เซ็น ยังไม่มีข้อยืนยันว่าตัว
    Enhanced โหลดอะไรจากโฟลเดอร์นี้หรือไม่ ลายเซ็นที่ถูกต้องบอกว่าใครเซ็นและไฟล์ไม่ถูกแก้ตั้งแต่ตอนนั้น แต่ไม่ได้บอกว่า
    ไฟล์ทำอะไร เคยมีใบรับรองที่ถูกขโมยจากบริษัทจริงแล้วเอาไปเซ็นมัลแวร์ในชื่อบริษัทนั้น และข้อนี้ไม่ได้ตรวจการเพิกถอนใบรับรอง
    ชื่อผู้เซ็นมีไว้ให้ผู้อ่านไปค้นต่อ
  retention: >-
    เห็นเฉพาะไฟล์ที่อยู่ในโฟลเดอร์ตอนที่สแกนเท่านั้น ไฟล์ที่ถูกลบไปก่อนหน้านั้นไม่เหลือร่องรอยที่นี่
    และข้อนี้บอกไม่ได้ว่าก่อนหน้านี้ในโฟลเดอร์เคยมีอะไร
  falsepositives:
    - overlay เครื่องมืออัดหน้าจอ และเครื่องมือเพิ่มประสิทธิภาพจากผู้ผลิตที่เป็นที่รู้จัก ซึ่งใส่ไฟล์ที่เซ็นแล้วไว้ที่นี่
    - ม็อดกราฟิกรุ่นที่เซ็นแล้ว ที่ผู้เล่นใส่ไว้ที่นี่
    - ซอฟต์แวร์ที่นักพัฒนาเซ็นในนามตัวเอง ใบรับรองจึงเป็นชื่อจริงของคนคนนั้น

282115fe-863d-4e2e-9cf5-4eaf8e7545e4:
  title: ตรวจลายเซ็นของไฟล์ FiveM ไม่ได้
  description: >-
    ไฟล์ที่โปรแกรมนี้พบในโฟลเดอร์ plugin ของ FiveM หรือตัว FiveM.exe เอง ถูกอ่านรายชื่อได้ แต่เมื่อถาม Windows
    เรื่องลายเซ็นที่ฝังอยู่ในไฟล์กลับไม่ได้คำตอบ แถวนี้แสดง path ของไฟล์ และไม่รู้อะไรเลยเกี่ยวกับลายเซ็นของไฟล์นั้น
    ทั้งไม่รู้ว่ามี และไม่รู้ว่าไม่มี rule อื่นของไฟล์กลุ่มนี้ตัดสินจากลายเซ็นที่ Windows รายงาน ไฟล์ที่ตรวจไม่สำเร็จจึงไม่ตรงกับ
    rule ตัวไหนเลย จึงแสดงไว้ที่นี่แทน เพื่อไม่ให้ตกหล่นไปจากรายงาน ข้อนี้ไม่ได้บอกว่าตรวจไม่สำเร็จเพราะอะไร ไฟล์คืออะไร
    หรือมีใครทำอะไรกับไฟล์
  retention: >-
    เห็นเฉพาะไฟล์ที่มีอยู่ตอนที่สแกน และเฉพาะความพยายามตรวจในรอบนั้นเท่านั้น สแกนอีกรอบอาจตรวจไฟล์เดียวกันได้ไม่มีปัญหา
  falsepositives:
    - ไฟล์ที่โปรแกรมอื่นเปิดค้างไว้โดยไม่ยอมให้ใครอ่านในจังหวะนั้น เช่น แอนติไวรัสกำลังสแกน ตัวติดตั้งหรือตัวอัปเดต
      กำลังเขียนไฟล์ หรือ FiveM กำลังอัปเดตตัวเอง
    - path ยาวเกินไป หรือชื่อไฟล์ที่ Windows เปิดไม่ได้ ซึ่งโปรแกรมแตกไฟล์บางตัวสร้างขึ้นเมื่อแตกลงโฟลเดอร์ที่ลึกมาก
    - คำตอบจาก Windows ที่โปรแกรมนี้ไม่ได้จัดประเภทไว้ โปรแกรมนี้ระบุเฉพาะคำตอบที่มีเอกสารรองรับ
      คำตอบอื่นทั้งหมดจะมาอยู่ที่นี่ แทนที่จะเดาเอา
    - ซอฟต์แวร์ความปลอดภัยที่ดักหรือบล็อกไม่ให้โปรแกรมหนึ่งอ่านไฟล์ของโปรแกรมอื่น

148cbcdd-8d18-4af6-a541-71cc7f21b2eb:
  title: FiveM.exe ไม่มีลายเซ็นฝังในไฟล์ซึ่งตรวจผ่านบนเครื่องนี้
  description: >-
    FiveM.exe ในโฟลเดอร์โปรแกรมของ FiveM for GTA V Legacy (%LOCALAPPDATA%\FiveM) หรือของ FiveM for GTA V
    Enhanced (%LOCALAPPDATA%\FiveM for GTAV Enhanced) ไม่มีลายเซ็นฝังอยู่ หรือมีแต่ตรวจไม่ผ่าน หรือ Windows
    ตรวจไม่ได้ถ้าไม่ต่ออินเทอร์เน็ต ไฟล์ที่แสดงจะบอกว่าเป็นกรณีไหนและเป็นรุ่นไหน "ตรวจไม่ได้ถ้าไม่ต่ออินเทอร์เน็ต"
    รวมถึงสายใบรับรองที่ไปจบที่ใบรับรองราก (root) ซึ่งเครื่องนี้ไม่ได้ถือไว้ว่าเชื่อถือได้ ถ้าไม่ต่ออินเทอร์เน็ตจะแยกกรณีนี้
    ออกจากใบรับรองรากที่ไม่มีใครเชื่อถือไม่ได้ ลายเซ็นที่เซ็นด้วยใบรับรองที่ออกให้ตัวเอง (self-signed) ก็ออกมาแบบนี้เช่นกัน
    บนเครื่องเพียงเครื่องเดียวที่วัดมา
    FiveM.exe ของทั้งสองรุ่นมีลายเซ็นฝังในไฟล์ที่ถูกต้อง ข้อนี้ไม่ได้บอกว่าไฟล์ถูกแก้ ไฟล์ทำอะไร หรือเคยถูกรันหรือไม่
    เครื่องที่ติดตั้งแล้วไม่มี FiveM.exe หรือไม่มี FiveM เลย ก็ได้ผล "ไม่พบ" ที่นี่เหมือนกัน และ FiveM.exe
    ที่ตรวจลายเซ็นไม่ได้เลยจะแสดงอยู่ใต้ "ตรวจลายเซ็นของไฟล์ FiveM ไม่ได้" แทน
  retention: >-
    เป็นไฟล์ในสภาพตอนที่สแกนเท่านั้น บอกอะไรไม่ได้เลยเกี่ยวกับไฟล์ในช่วงก่อนหน้า และการอัปเดต FiveM เปลี่ยนไฟล์นี้ได้
  falsepositives:
    - เครื่องที่คลังใบรับรองของ Windows ยังไม่มีใบรับรองราก (root) ที่ลายเซ็นนี้อ้างถึง ปกติ Windows
      จะดึงมาจากอินเทอร์เน็ตครั้งแรกที่ต้องใช้ แต่ข้อนี้ไม่เคยออกอินเทอร์เน็ต วัดแล้วบนเครื่องทดสอบที่ลบใบรับรองราก
      ออกจากคลัง กับไฟล์ของผู้เผยแพร่รายอื่น ลายเซ็นออกมาเป็น unverifiable_offline ไม่ว่าลายเซ็นจะพกใบรับรองราก
      มาเองหรือไม่ และไม่ได้ออกมาเป็น invalid ส่วนลายเซ็นของ FiveM.exe เองพกอะไรมาบ้างยังไม่ได้วัด
    - FiveM.exe เสียจากการอัปเดตที่ถูกขัดจังหวะ ดิสก์มีปัญหา หรือซอฟต์แวร์ความปลอดภัยแก้ไขหรือกักไฟล์ไปบางส่วน
    - ตัว FiveM ที่นักพัฒนา build เองจากซอร์สโค้ดที่ Cfx.re เผยแพร่ แล้วนำมาวางแทนตัวที่ติดตั้งไว้
      ซึ่งไม่มีลายเซ็นของ Rockstar Games
    - ตัว client รุ่นเบต้าหรือรุ่นทดสอบ ถ้ามีการออกแบบไม่เซ็นหรือเซ็นต่างออกไป ซึ่งยังไม่ได้วัดอะไรเกี่ยวกับรุ่นเหล่านั้นเลย

2dc11b64-72a2-48f5-a273-985e906d5a9e:
  title: FiveM.exe มีลายเซ็นที่ถูกต้อง แต่ไม่ได้เซ็นด้วยใบรับรองที่ rule นี้รู้จัก
  description: >-
    FiveM.exe ในโฟลเดอร์โปรแกรมของ FiveM for GTA V Legacy หรือของ FiveM for GTA V Enhanced มีลายเซ็นฝังในไฟล์
    ที่ถูกต้อง แต่ใบรับรองที่ใช้เซ็นไม่ใช่ใบที่ rule นี้คาดไว้ แถวนี้แสดงชื่อผู้เซ็นและ SHA-256 ของใบรับรอง rule นี้รู้จัก
    ใบรับรองเพียงใบเดียว คือใบที่ใช้เซ็น FiveM.exe ของทั้งสองรุ่นตอนที่วัดเมื่อ 2026-09-13 ชื่อ "Rockstar Games, Inc."
    ใช้ได้ตั้งแต่ 2026-07-21 ถึง 2027-09-05 ผู้เผยแพร่ซอฟต์แวร์ต่ออายุใบรับรองสำหรับเซ็นโค้ด โดยทั่วไปทุกหนึ่งถึงสามปี ใบรับรองที่ต่างออกไป
    แต่ชื่อผู้เซ็นเหมือนเดิม จึงน่าจะเป็น FiveM.exe รุ่นเก่ากว่าหรือใหม่กว่า ไม่ใช่โปรแกรมอื่น
    ชื่อผู้เซ็นอย่างเดียวพิสูจน์อะไรไม่ได้ทั้งสองทาง เพราะใบรับรองที่ถูกขโมยก็มีชื่อบริษัทจริงติดมาด้วย
    ข้อนี้ไม่ได้บอกว่าไฟล์ถูกแก้ หรือเคยถูกรัน
  retention: >-
    เป็นไฟล์ในสภาพตอนที่สแกนเท่านั้น บอกอะไรไม่ได้เลยเกี่ยวกับไฟล์ในช่วงก่อนหน้า และการอัปเดต FiveM เปลี่ยนไฟล์นี้ได้
  falsepositives:
    - ผู้เผยแพร่ต่ออายุใบรับรอง FiveM.exe ทุกไฟล์ที่เซ็นหลังจากนั้นจะใช้ใบรับรองใหม่ และแถวนี้จะขึ้นกับทุกคน
      ที่อัปเดตแล้วจนกว่า rule จะถูกแก้ ผู้ตรวจที่เห็นชื่อผู้เซ็นเดียวกันในรายงานของผู้เล่นหลายคน ควรถือว่าแถวนี้
      ไม่ได้บอกอะไร ให้ตรวจใบรับรองของ FiveM.exe ที่ติดตั้งใหม่จาก Cfx.re บนเครื่องของตัวเอง แล้วแจ้งโปรเจกต์นี้ให้แก้ rule
    - FiveM.exe ที่ไม่ได้อัปเดตเลยตั้งแต่ก่อน 2026-07-21 ซึ่งเป็นวันที่ใบรับรองที่ rule นี้รู้จักเริ่มใช้ได้
      ลายเซ็นที่ทำก่อนวันนั้นทำด้วยใบรับรองใบก่อน FiveM อัปเดตตัวเอง
      กรณีนี้จึงน่าจะเป็นผู้เล่นที่ไม่ได้เปิด FiveM เลยตั้งแต่นั้น
    - ตัว client รุ่นเบต้าหรือรุ่นทดสอบที่เซ็นด้วยใบรับรองอื่น ซึ่งยังไม่ได้วัดอะไรเกี่ยวกับรุ่นเหล่านั้นเลย

7d493537-7ecf-4f97-90a0-119e079d30d2:
  title: มีไฟล์ Prefetch ถูกตั้งเป็นอ่านอย่างเดียว
  description: >-
    มีไฟล์ในโฟลเดอร์ Prefetch ของ Windows ที่ติด attribute อ่านอย่างเดียว (read-only) ไฟล์เหล่านี้ Windows
    เขียนและเขียนทับเอง และบนเครื่อง Windows 11 เครื่องเดียวที่โครงการนี้วัดมา ไม่มีไฟล์ไหนติด attribute นี้เลย
    แถวนี้บอกชื่อไฟล์และสิ่งที่ไฟล์บันทึกไว้ แต่ไม่ได้บอกว่าใครตั้ง ตั้งเมื่อไร หรือตั้งทำไม และไม่ใช่หลักฐานว่ามีการซ่อนอะไร
    หรือว่าโปรแกรมที่ไฟล์พูดถึงถูกใช้โกง
  retention: >-
    เป็น attribute ณ ตอนที่สแกนเท่านั้น และดูได้เฉพาะไฟล์ Prefetch ที่ยังอยู่ในโฟลเดอร์ บอกไม่ได้ว่าถูกตั้งไว้ตั้งแต่เมื่อไร
    และบอกอะไรไม่ได้เลยเกี่ยวกับไฟล์ที่ถูกลบไปแล้ว
  falsepositives:
    - มีคนเลือก "อ่านอย่างเดียว" ในหน้า Properties ของโฟลเดอร์ Prefetch หรือโฟลเดอร์ที่อยู่เหนือขึ้นไป ซึ่ง Windows
      จะนำไปตั้งให้กับไฟล์ข้างในทั้งหมด
    - ไฟล์ถูกคัดลอกหรือกู้คืนกลับเข้าโฟลเดอร์ด้วยโปรแกรมสำรองข้อมูล ทำอิมเมจ หรือคัดลอกไฟล์ที่เก็บ attribute
      ของไฟล์ไว้ด้วย อย่างที่ robocopy ของ Windows เองทำเป็นค่าเริ่มต้น

