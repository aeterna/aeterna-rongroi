id: e15d7a5a-9cd0-481e-9582-8cdaa9764863
collector: usn
retention: >-
  The change journal keeps a size, not a time: past its maximum size the oldest records are
  truncated. How long that reaches back depends on how busy the drive is — 39 minutes on the one PC
  measured — and the span is the one this scan read.
documented: true
references:
  - https://learn.microsoft.com/en-us/windows/win32/api/winioctl/ns-winioctl-usn_journal_data_v0
  - docs/adr/0047-usn-journal-feasibility.md
