id: eaf79187-e067-43ed-9afe-bffe65e6b2e5
title: When Program Compatibility Assistant recorded a program named like FiveM's game process
description: >-
  Puts on the timeline the time the Windows Program Compatibility Assistant recorded for a program
  named FiveM_b<number>_GTAProcess.exe, the name FiveM gives the game process it starts, with the
  game build in place of <number>. The record holds a name, not which program it was, so this shows
  when a program of that name ran according to this record, not that FiveM or GTA V ran. It is not
  evidence of anything, and a missing entry does not mean the game never ran.
status: experimental
# A timeline selector (ADR 0051): it makes no evidence and selects by name, which ADR 0034 forbids a rule.
role: timeline
collector: pca
strength: context
match:
  name|startswith: FiveM_b
  name|endswith: _GTAProcess.exe
retention: >-
  Only what the Program Compatibility Assistant files still hold. Windows keeps these files on
  Windows 11 22H2 and later.
falsepositives:
  - Any program whose name begins with FiveM_b and ends with _GTAProcess.exe — the record holds a
    name and nothing that identifies the program, so a program renamed to that shape is recorded
    under it
  - A program of another name is not selected, whatever it is, so an absent entry does not mean that
    nothing ran
  - Windows not writing a record — these files exist only on Windows 11 22H2 and later
  - Windows keeping the record after the program's files were removed
author: aeterna-rongroi contributors
date: 2026-09-17
tags: [pca, timeline]
