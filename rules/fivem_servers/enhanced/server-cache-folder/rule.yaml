id: c402aedc-1ed7-49a6-998c-0762e17e9bd0
title: FiveM for GTA V Enhanced keeps a cache folder for a server
description: >-
  FiveM for GTA V Enhanced keeps one cache folder per server it joined, and this row is one of them:
  the folder's name, and when it was created and last changed. What the name is made from is not known;
  it stays the same for that server on this PC, so the same name in two reports of this PC is the same
  server. Whether another PC gets the same name for that server is not known. SS mode shows
  the name only if the player agreed to show server identities. Read only in a full scan. This says that
  the game joined a server, not what anyone did on it.
status: experimental
collector: fivem_servers
strength: context
match:
  server_folder|exists: true
retention: >-
  The server cache folders there when the scan ran. A folder the player, a cleaner or a reinstall removed
  is not seen, and whether FiveM removes old ones itself is not known.
unmeasured_when: [not_windows]
falsepositives:
  - Joining any server with FiveM for GTA V Enhanced, which is what leaves these folders
  - A folder kept from a server joined long ago, or by another person using this Windows account
author: aeterna-rongroi contributors
date: 2026-09-18
tags: [fivem_servers, full_scan]
