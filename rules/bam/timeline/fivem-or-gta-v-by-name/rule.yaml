id: 19dc7372-391e-4874-9c94-92ee6170f2df
title: When BAM recorded a program named like FiveM or GTA V
description: >-
  Puts on the timeline the time the Windows Background Activity Moderator (BAM) recorded for a
  program named FiveM.exe, GTA5.exe, GTA5_Enhanced.exe or PlayGTAV.exe, the names FiveM and GTA V
  give their executables. The record holds a name, not which program it was, so this shows when a
  program of that name ran according to this record, not that FiveM or GTA V ran. It is not evidence
  of anything, and a missing entry does not mean the game never ran.
status: experimental
# A timeline selector (ADR 0051): it makes no evidence and selects by name, which ADR 0034 forbids a rule.
role: timeline
collector: bam
strength: context
match:
  name: [FiveM.exe, GTA5.exe, GTA5_Enhanced.exe, PlayGTAV.exe]
retention: >-
  Only what BAM still holds. Windows removes BAM entries older than seven days when it starts, so
  an older run leaves no entry here.
falsepositives:
  - Any program of one of these names — the record holds a name and nothing that identifies the
    program, so a program renamed to one of them is recorded under it
  - A program of another name is not selected, whatever it is, so an absent entry does not mean that
    nothing ran
  - Windows not keeping a record — BAM entries older than seven days are removed when Windows
    starts
  - Windows keeping the record after the program's files were removed
author: aeterna-rongroi contributors
date: 2026-09-17
tags: [bam, timeline]
