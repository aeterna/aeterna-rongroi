# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
id: 2dc11b64-72a2-48f5-a273-985e906d5a9e
title: FiveM.exe is validly signed, but not with the certificate this rule knows
description: >-
  FiveM.exe, in the program folder of FiveM for GTA V Legacy or of FiveM for GTA V Enhanced, carries a
  valid embedded signature, and the certificate that made it is not the one this rule expects. The
  row names the signer and the certificate's SHA-256. This rule knows one certificate: the one both
  editions' FiveM.exe were signed with when measured on 2026-09-13 — "Rockstar Games, Inc.", valid
  from 2026-07-21 to 2027-09-05. Publishers renew code-signing certificates, typically every one to
  three years, so a different certificate with the same signer name is most likely an older or a newer
  FiveM.exe, not a different program. A signer name on its own proves nothing either way, because stolen certificates
  carry the real company's name. This does not say that the file was changed or that it was run.
status: experimental
collector: fivem_dir
strength: presence
match:
  location: [legacy_exe, enhanced_exe]
  signature: valid
# The signing certificate of FiveM.exe, measured on 2026-09-13 on one Windows 11 machine from both
# editions as installed and updated by FiveM itself: the SHA-256 of the encoded certificate, which
# `Get-AuthenticodeSignature` and this program's own check agreed on (ADR 0036). It is not from memory
# and not from a third party. When the publisher renews, this entry goes stale for every player at
# once; the entry for the new certificate is measured the same way and added beside this one, and this
# one stays for as long as FiveM.exe files it signed are still in use.
allow:
  - signer_cert_sha256: 65866007102ff66498c1ef739cf23dff71ae3d08da0d9d759b89d1a409c4208f
retention: >-
  The file as it was when the scan ran. It says nothing about the file at any earlier time, and an update
  of FiveM can replace it.
# Left out deliberately: `access_denied`. The program folder is inside the player's own profile.
unmeasured_when: [not_windows]
falsepositives:
  - The publisher renewed its certificate. Every FiveM.exe signed after that carries a new certificate,
    and this row then appears for everyone who has updated until the rule is updated. A reviewer who
    sees the same signer name on many players' reports should treat the row as saying nothing, check
    the certificate on a FiveM.exe freshly installed from Cfx.re on a machine of their own, and report
    it to this project so the rule can be updated
  - A FiveM.exe that has not updated since before 2026-07-21, when the certificate this rule knows
    became valid. A signature made before then was made with an earlier certificate. FiveM updates
    itself, so this is most likely a player who has not launched FiveM since
  - A beta or test build of the client signed with a different certificate. Nothing was measured
    about those
references:
  - https://learn.microsoft.com/en-us/windows/win32/api/wintrust/nf-wintrust-winverifytrust
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.security/get-authenticodesignature
author: aeterna-rongroi contributors
date: 2026-09-13
tags: [fivem_dir, client, signature]
related:
  - id: 148cbcdd-8d18-4af6-a541-71cc7f21b2eb
    type: similar
