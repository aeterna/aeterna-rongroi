# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
id: 148cbcdd-8d18-4af6-a541-71cc7f21b2eb
title: FiveM.exe has no embedded signature that verifies here
description: >-
  FiveM.exe, in the program folder of FiveM for GTA V Legacy (%LOCALAPPDATA%\FiveM) or of FiveM for GTA
  V Enhanced (%LOCALAPPDATA%\FiveM for GTAV Enhanced), has no signature embedded in it, one that does
  not verify, or one Windows could not verify without the internet; the file shown says which and
  which edition. "Could not verify without the internet" includes a certificate chain that ends at a
  root certificate this PC does not hold as trusted, which offline cannot be told apart from a root
  nobody trusts: a self-signed signature reads that way too. On the one machine this was measured on,
  both editions' FiveM.exe carried a valid embedded signature. This does not say that the file was changed, what it does, or that it was ever
  run. An install with no FiveM.exe — or no FiveM at all — is "not found" here too, and a FiveM.exe
  whose signature could not be checked at all is shown under "A FiveM file's signature could not be
  checked" instead.
status: experimental
collector: fivem_dir
strength: presence
# The three answers that are not `valid`, as in the plugin-folder rules. `unverifiable_offline` is kept
# in rather than left to fall silently to `not_found`: for this file it is the answer that most needs a
# reader, and the falsepositives say what ordinarily produces it (ADR 0036).
match:
  location: [legacy_exe, enhanced_exe]
  signature: [no_embedded_signature, invalid, unverifiable_offline]
retention: >-
  The file as it was when the scan ran. It says nothing about the file at any earlier time, and an update
  of FiveM can replace it.
# Left out deliberately: `access_denied`. The program folder is inside the player's own profile.
unmeasured_when: [not_windows]
falsepositives:
  - A PC whose Windows certificate store does not yet hold the root certificate the signature chains
    to. Windows normally fetches those from the internet the first time they are needed, and this
    check never goes online. Measured on a test machine with a root removed from its stores, other
    publishers' signatures then read unverifiable_offline — whether or not they carried the root
    themselves — and not invalid. What FiveM.exe's own signature carries was not measured
  - FiveM.exe damaged by an interrupted update, a disk problem, or security software that modified or
    partly quarantined it
  - A FiveM client a developer built from Cfx.re's published source code and put in place of the
    installed one, which carries no Rockstar Games signature
  - A beta or test build of the client, if one is shipped unsigned or signed differently. Nothing was
    measured about those
references:
  - https://learn.microsoft.com/en-us/windows/win32/api/wintrust/nf-wintrust-winverifytrust
  - https://learn.microsoft.com/en-us/windows-server/identity/ad-cs/certificate-trust
author: aeterna-rongroi contributors
date: 2026-09-13
tags: [fivem_dir, client, signature]
