# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
# The three places were read from Atlas' own published source, not from memory (ADR 0057).
id: fd58dec6-84c1-49cb-806c-10b4614a046f
title: A folder or key the Atlas playbook installs is on this PC
description: >-
  One of the places the Atlas playbook creates when it is applied is here: its module folder, its
    desktop folder of configuration scripts, or its own registry key. Atlas turns off parts of Windows,
    and some of those parts are what this program and a server's anti-cheat read. Which operating
    system to run is the owner's choice; this row says what is installed, not that anything was
    cheated. What is inside the folder was not read.
status: experimental
collector: install_marker
strength: posture
match:
  marker: ["%SystemRoot%\\AtlasModules", "%SystemRoot%\\AtlasDesktop", "HKLM\\SOFTWARE\\AtlasOS"]
  present: true
retention: Current state only. It says nothing about how the PC was set up in the past.
unmeasured_when: [not_windows, access_denied, source_absent]
falsepositives:
  - Anyone who applied the playbook for privacy, for battery life or for an old PC, and never touched a game
  - A PC bought second-hand with the playbook already applied
  - A folder or key left behind after the playbook was removed or reverted
references:
  - https://github.com/Atlas-OS/Atlas
author: aeterna-rongroi contributors
date: 2026-09-21
tags: [posture, install_marker]
