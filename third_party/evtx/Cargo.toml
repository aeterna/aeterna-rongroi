# Vendored from evtx 0.12.2 (crates.io), upstream MIT OR Apache-2.0.
# See third_party/evtx/PROVENANCE.md for what was removed and how to verify the rest is byte-identical
# to the published crate, and docs/adr/0018-evtx-parsing.md for why this is vendored rather than
# depended on from the registry.
#
# Divergence from the published manifest, all of it removal:
#   - [[bin]], [[bench]] and [[test]] targets, with their `src/bin/`, `src/benches/` and `tests/`
#     sources. None is a library module; the library builds without them.
#   - [dev-dependencies] and [build-dependencies], which only those targets needed. `build = false`
#     upstream already means there is no build script, so `skeptic` went with them.
#   - [profile.release], which cargo ignores outside a workspace root.
# Every [dependencies] entry, every feature and every `auto*` key is upstream's, unchanged, so no
# `cfg(feature = ...)` in the vendored source becomes unexpected. No key is added — not `publish`, not
# a lint, not a profile; the only additions are the comment lines you are reading. Removal is auditable
# against the published manifest, whereas an addition hides in a file nobody diffs.

[package]
edition = "2024"
name = "evtx"
version = "0.12.2"
authors = ["Omer Ben-Amram <omerbenamram@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Fast (and safe) parser for the Windows XML Event Log (EVTX) format"
homepage = "https://github.com/omerbenamram/EVTX"
readme = "README.md"
license = "MIT/Apache-2.0"
repository = "https://github.com/omerbenamram/EVTX"

[features]
bench = []
default = [
    "multithreading",
    "evtx_dump",
]
evtx_dump = [
    "simplelog",
    "clap",
    "dialoguer",
    "indoc",
    "anyhow",
    "tempfile",
    "wevt_templates",
]
fast-alloc = [
    "tikv-jemallocator",
    "rpmalloc",
]
multithreading = ["rayon"]
wevt_templates = [
    "glob",
    "goblin",
]

[lib]
name = "evtx"
path = "src/lib.rs"

[dependencies.ahash]
version = "0.8"

[dependencies.anyhow]
version = "1"
optional = true

[dependencies.bitflags]
version = "2"

[dependencies.bumpalo]
version = "3.19.1"
features = ["collections"]

[dependencies.byteorder]
version = "1"

[dependencies.clap]
version = "4"
optional = true

[dependencies.crc32fast]
version = "1"

[dependencies.dialoguer]
version = "0.12"
optional = true

[dependencies.encoding]
version = "0.2.33"

[dependencies.glob]
version = "0.3"
optional = true

[dependencies.goblin]
version = "0.10"
optional = true

[dependencies.indoc]
version = "2"
optional = true

[dependencies.jiff]
version = "0.2.17"
features = [
    "logging",
    "serde",
]

[dependencies.log]
version = "0.4.17"
features = ["release_max_level_debug"]

[dependencies.rayon]
version = "1"
optional = true

[dependencies.serde]
version = "1"

[dependencies.serde_json]
version = "1"
features = ["preserve_order"]

[dependencies.simplelog]
version = "0.12.0"
optional = true

[dependencies.sonic-rs]
version = "0.5.6"

[dependencies.tempfile]
version = "3.3.0"
optional = true

[dependencies.thiserror]
version = "2"

[dependencies.utf16-simd]
version = "0.1.0"
features = ["sonic-writeext"]

[dependencies.winstructs]
version = "0.3.0"

[dependencies.zmij]
version = "1.0.1"

[target."cfg(not(windows))".dependencies.tikv-jemallocator]
version = "0.6.0"
optional = true

[target."cfg(windows)".dependencies.rpmalloc]
version = "0.2.2"
optional = true
