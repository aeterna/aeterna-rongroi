[package]
name = "rongroi-parsers"
description = "aeterna-rongroi parsers: Windows artifact bytes in, plain structs out"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# jiff: the FILETIME and PCA timestamp arithmetic lives here, in one tested place, rather than in every
# caller (ADR 0013). Only calendar arithmetic is used: this crate never reads a time zone database and
# never asks for the current time. jiff is already in the workspace lockfile via the CLI and xtask, so
# this adds no new dependency to the build.
jiff.workspace = true
# prefetch-core: the MAM/Xpress-Huffman decompressor and the SCCA v30/v31 reader, rather than our own
# (ADR 0015). It is pure — no filesystem, no network, `#![forbid(unsafe_code)]` — and its only dependency
# is `xpress-huffman`, so it adds two Apache-2.0 crates to the lockfile and nothing else. Its types stop at
# `prefetch.rs`: `PrefetchError` never appears in a signature outside that module.
prefetch-core = { workspace = true }
thiserror.workspace = true

[lints]
workspace = true
