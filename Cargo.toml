# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.

[workspace]
resolver = "3"
members = ["crates/*", "xtask", "apps/desktop/src-tauri"]
# The desktop app needs webkit2gtk to build on Linux; plain `cargo` commands skip it, `--workspace` includes it.
default-members = ["crates/*", "xtask"]
# The fuzz targets are their own workspace and need nightly (cargo-fuzz drives libFuzzer through
# `-Z sanitizer`). Excluding them is what keeps the 1.98.1 toolchain pinned in rust-toolchain.toml
# building, linting and testing everything else exactly as before: `cargo clippy --all-targets` and
# `cargo deny check` never see a nightly-only crate (ADR 0016).
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/aeterna/aeterna-rongroi"
publish = false

[workspace.dependencies]
rongroi-core = { path = "crates/rongroi-core" }
rongroi-host = { path = "crates/rongroi-host" }
rongroi-host-windows = { path = "crates/rongroi-host-windows" }
rongroi-collectors = { path = "crates/rongroi-collectors" }
rongroi-parsers = { path = "crates/rongroi-parsers" }

anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
insta = { version = "1.48", features = ["json", "redactions"] }
jiff = "0.2.35"
prefetch-core = "0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = "1.2"
sha2 = "0.11"
thiserror = "2.0.20"
uuid = "1.26"
windows = "0.62"
windows-registry = "0.100"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
