# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
#
# Its own workspace, excluded from the root one (`[workspace] exclude` in ../Cargo.toml), which is
# cargo-fuzz's own convention. cargo-fuzz drives libFuzzer through `-Z sanitizer` and so needs
# nightly, while the rest of the repository is pinned to stable 1.98.1 in rust-toolchain.toml. Being
# a separate workspace is what keeps `cargo build`, `cargo clippy`, `cargo nextest run` and
# `cargo deny check` from ever seeing this crate (ADR 0016).

[package]
name = "rongroi-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/aeterna/aeterna-rongroi"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
rongroi-parsers = { path = "../crates/rongroi-parsers" }

# This is its own workspace, so the root `[patch.crates-io]` does not reach it and the patch has to be
# repeated here. Without this stanza `fuzz_evtx` would build the unpatched registry `evtx` and would
# keep finding the 7.7 GB allocation the vendored copy exists to bound — a fuzz gate testing code the
# product does not ship. See ../Cargo.toml, ../third_party/evtx/PROVENANCE.md and ADR 0018.
[patch.crates-io]
evtx = { path = "../third_party/evtx" }

[profile.release]
debug = 1

# One target per public parser entry point. `test`, `doc` and `bench` are off because these are
# libFuzzer harnesses with `#![no_main]`, not ordinary binaries.
#
# The names are snake_case, which is cargo-fuzz's convention and the name `cargo fuzz run <target>`
# takes, so cargo warns once per target that a binary "should have a kebab-case name". Renaming them
# would silence the warning and break every documented command; the warnings are expected here.

[[bin]]
name = "fuzz_bam"
path = "fuzz_targets/fuzz_bam.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pca_app_launch"
path = "fuzz_targets/fuzz_pca_app_launch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pca_general"
path = "fuzz_targets/fuzz_pca_general.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_filetime"
path = "fuzz_targets/fuzz_filetime.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_prefetch"
path = "fuzz_targets/fuzz_prefetch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_evtx"
path = "fuzz_targets/fuzz_evtx.rs"
test = false
doc = false
bench = false
