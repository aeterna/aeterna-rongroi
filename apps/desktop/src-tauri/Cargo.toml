[package]
name = "rongroi-desktop"
description = "aeterna-rongroi desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "aeterna-rongroi"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
jiff.workspace = true
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rongroi-collectors.workspace = true
rongroi-core.workspace = true
rongroi-host.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = [] }

[target.'cfg(windows)'.dependencies]
rongroi-host-windows.workspace = true

[lints]
workspace = true
