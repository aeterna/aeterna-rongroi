# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
# Optional local hooks (https://lefthook.dev). CI is the source of truth.

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all --check
    unicode:
      run: cargo xtask check-unicode
    typos:
      run: typos
