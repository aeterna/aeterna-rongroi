# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
# cargo-deny configuration. The [bans] list enforces AGENTS.md hard rule 1 (no network code); see ADR 0003.

[graph]
# Desktop targets only: Tauri pulls an HTTP client only for mobile targets, which we do not build.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Only "unmaintained" notices, with no upgrade available. The Tauri ones are revisited on every Tauri
# update; the `encoding` one is revisited on every `evtx` update (ADR 0018).
ignore = [
  { id = "RUSTSEC-2021-0153", reason = "encoding 0.2.33: unmaintained since 2016 and the advisory lists no patched version. It is a non-optional dependency of `evtx` — no feature flag removes it — and is the ANSI codec that decodes 8-bit strings inside a log's binary XML. The exposure is not zero: those bytes come from the .evtx file under examination, so a decoding defect in an unmaintained crate is reachable from input this program does not control. What bounds it is that this is an unmaintained notice rather than a known vulnerability, that the crate performs no I/O and this program is offline (ADR 0003), and that `fuzz_evtx` fuzzes the path that reaches it. Revisit if evtx moves to encoding_rs." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro via glib-macros → gtk, Linux desktop target only; we ship Windows builds" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range: via urlpattern → tauri-utils; no maintained replacement upstream yet" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common: via urlpattern → tauri-utils; no maintained replacement upstream yet" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property: via urlpattern → tauri-utils; no maintained replacement upstream yet" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: via urlpattern → tauri-utils; no maintained replacement upstream yet" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: via urlpattern → tauri-utils; no maintained replacement upstream yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is the set we accept, not the set we currently use (the desktop app adds more).
unused-allowed-license = "allow"
# Licenses compatible with distributing the whole program under GPL-3.0-or-later.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# Our own crates are `publish = false` and licensed GPL-3.0-or-later.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "reqwest", reason = "offline-only: no HTTP clients (ADR 0003)" },
  { crate = "hyper", reason = "offline-only: no HTTP stacks (ADR 0003)" },
  { crate = "ureq", reason = "offline-only: no HTTP clients (ADR 0003)" },
  { crate = "isahc", reason = "offline-only: no HTTP clients (ADR 0003)" },
  { crate = "attohttpc", reason = "offline-only: no HTTP clients (ADR 0003)" },
  { crate = "curl", reason = "offline-only: no HTTP clients (ADR 0003)" },
  { crate = "surf", reason = "offline-only: no HTTP clients (ADR 0003)" },
  { crate = "h2", reason = "offline-only: no HTTP/2 (ADR 0003)" },
  { crate = "quinn", reason = "offline-only: no QUIC (ADR 0003)" },
  { crate = "tungstenite", reason = "offline-only: no WebSockets (ADR 0003)" },
  { crate = "tokio-tungstenite", reason = "offline-only: no WebSockets (ADR 0003)" },
  { crate = "tauri-plugin-http", reason = "offline-only (ADR 0003)" },
  { crate = "tauri-plugin-updater", reason = "no auto-update; users download releases (ADR 0003)" },
  { crate = "tauri-plugin-websocket", reason = "offline-only (ADR 0003)" },
  { crate = "tauri-plugin-upload", reason = "offline-only (ADR 0003)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
