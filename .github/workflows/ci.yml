# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
# Platform-independent checks. Windows-only code is built and exercised in windows.yml.

name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (ubuntu)
    runs-on: ubuntu-latest
    # Bounded so that a test which stops making progress fails in minutes rather than at the
    # runner's six-hour default. `.config/nextest.toml` bounds the individual test; this bounds
    # everything else in the job (ADR 0016's fuzz job already had one).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two deep so a pull request's merge commit has its base (`HEAD^1`) for the LOLDrivers step.
          fetch-depth: 2
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-nextest,cargo-deny,cargo-insta,typos
      - name: Format
        run: cargo fmt --all --check
      # No `--workspace`: default-members exclude the desktop app, which needs webkit2gtk on Linux.
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # `cargo insta test` has no `--locked`; the Clippy step above already fails on a stale Cargo.lock.
      - name: Tests and snapshots (stale snapshots fail)
        run: cargo insta test --unreferenced reject --test-runner nextest
      - name: Rules and fixtures
        run: cargo xtask check-rules
      # docs/rules-reference.md and .th.md are written from the rules bundle. A rule, a rule translation
      # or a report label changed without rerunning `cargo xtask rules-reference` fails here, and the
      # error names that command.
      - name: Rule reference pages match the rules
        run: cargo xtask rules-reference --check
      # The vulnerable-driver data file is rebuilt from LOLDrivers at the commit its PROVENANCE.md names and
      # compared with the committed file (ADR 0048). Only `yaml/` is fetched, one commit deep, and the step
      # fails if any other file lands on disk. A pull request fetches only when it changes the data file's
      # folder, xtask, Cargo.lock or this workflow, so no other pull request waits on LOLDrivers being
      # reachable; every push to dev and main fetches. The program itself still never fetches the list.
      - name: LOLDrivers data file matches its source commit
        env:
          EVENT: ${{ github.event_name }}
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail
          dir=rules/driver_service/vulnerable-driver/loldrivers-listed
          # Captured first: `git diff | grep -q` under pipefail reads a match as a failed pipeline.
          changed=$(git diff --name-only HEAD^1 HEAD)
          if [ "$EVENT" = pull_request ] \
            && ! grep -q -E "^(${dir}/|xtask/|Cargo\.lock$|\.github/workflows/ci\.yml$)" <<<"$changed"; then
            echo "This pull request changes nothing the data file is built from or checked by: not fetched."
            exit 0
          fi
          # shellcheck disable=SC2016 # the backticks are the literal Markdown around the commit
          commit=$(sed -n 's/^| Commit | `\([0-9a-f]\{40\}\)`.*/\1/p' "$dir/PROVENANCE.md")
          if [ -z "$commit" ]; then
            echo "::error::no 40-digit commit on the Commit row of $dir/PROVENANCE.md"
            exit 1
          fi
          src="$RUNNER_TEMP/loldrivers"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/magicsword-io/LOLDrivers.git
          git -C "$src" fetch -q --depth 1 --filter=blob:none origin "$commit"
          git -C "$src" sparse-checkout set --no-cone '/yaml/'
          git -C "$src" -c advice.detachedHead=false checkout -q FETCH_HEAD
          outside=$(find "$src" -path "$src/.git" -prune -o -type f ! -path "$src/yaml/*" -print)
          if [ -n "$outside" ]; then
            echo "::error::files outside yaml/ were checked out:"
            echo "$outside"
            exit 1
          fi
          echo "yaml files: $(find "$src/yaml" -type f -name '*.yaml' | wc -l)"
          cargo xtask loldrivers --checkout "$src" --check
      - name: Clean baseline (the rule set stays quiet on an ordinary machine)
        run: cargo xtask check-baseline
      - name: Locales
        run: cargo xtask check-locales
      - name: No invisible or bidi characters
        run: cargo xtask check-unicode
      - name: No network crates, licenses, advisories, sources
        run: cargo deny check
      - name: Typos
        run: typos

  # A smoke gate, not a fuzzing campaign: every target is built, and each one is run for a fixed 30
  # seconds starting from the fixtures the L0 tests use. It proves the targets still compile against
  # the parsers' public API and that neither the seed corpus nor a short mutation run around it
  # produces a panic, an abort or a hang. Finding a deep bug takes hours of fuzzing and is not what
  # this job is for (ADR 0016).
  fuzz:
    name: fuzz smoke (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nightly for this job alone. cargo-fuzz drives libFuzzer through `-Z sanitizer`, which stable
      # does not have, and its default `--build-std` needs `rust-src`. Everything else in the
      # repository keeps building on the 1.98.1 toolchain pinned in rust-toolchain.toml: `fuzz/` is
      # excluded from the root workspace, so no other job even sees it.
      - name: Install a nightly toolchain for this job only
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      # Not taiki-e/install-action: it does not carry cargo-fuzz and would fall back to an unpinned
      # cargo-binstall, so the version is pinned and built here instead.
      - name: Install cargo-fuzz
        run: cargo +nightly install --locked cargo-fuzz@0.13.2
      - name: Build every fuzz target
        run: cargo +nightly fuzz build
      # One line per target rather than a loop, so the log names the target that failed. libFuzzer
      # writes anything new it finds to the FIRST corpus directory and reads the rest as seeds, which
      # is why the fixture directory is second: the fixtures are inputs, never an output. `-timeout=10`
      # makes a hang a failure of the run rather than of the job's clock.
      - name: Smoke-run each target on the fixtures the L0 tests use
        run: |
          mkdir -p fuzz/corpus/fuzz_bam fuzz/corpus/fuzz_pca_app_launch \
                   fuzz/corpus/fuzz_pca_general fuzz/corpus/fuzz_filetime \
                   fuzz/corpus/fuzz_prefetch fuzz/corpus/fuzz_evtx fuzz/corpus/fuzz_usn
          cargo +nightly fuzz run fuzz_bam fuzz/corpus/fuzz_bam fixtures/parsers/bam \
            -- -max_total_time=30 -timeout=10
          cargo +nightly fuzz run fuzz_pca_app_launch fuzz/corpus/fuzz_pca_app_launch fixtures/parsers/pca-app-launch \
            -- -max_total_time=30 -timeout=10
          cargo +nightly fuzz run fuzz_pca_general fuzz/corpus/fuzz_pca_general fixtures/parsers/pca-general \
            -- -max_total_time=30 -timeout=10
          cargo +nightly fuzz run fuzz_filetime fuzz/corpus/fuzz_filetime fixtures/parsers/bam \
            -- -max_total_time=30 -timeout=10
          cargo +nightly fuzz run fuzz_prefetch fuzz/corpus/fuzz_prefetch fixtures/prefetch \
            -- -max_total_time=30 -timeout=10
          cargo +nightly fuzz run fuzz_evtx fuzz/corpus/fuzz_evtx fixtures/evtx \
            -- -max_total_time=30 -timeout=10
          cargo +nightly fuzz run fuzz_usn fuzz/corpus/fuzz_usn fixtures/parsers/usn \
            -- -max_total_time=30 -timeout=10
      # A crash leaves its input in fuzz/artifacts/. Keeping it is the difference between "a target
      # failed" and being able to reproduce it with `cargo fuzz run <target> <file>`.
      - name: Keep the crashing input, if there was one
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  desktop-ui:
    name: desktop UI (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm typecheck
      - name: Lint and format (Biome; bans network globals)
        run: pnpm lint
      - name: UI tests against the Rust report snapshots
        run: pnpm test

  reuse:
    name: licensing headers (REUSE)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
