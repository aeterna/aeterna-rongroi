# Part of aeterna-rongroi, a cheat-detection tool. Using it to evade detection is out of scope — see AGENTS.md.
# Builds, checks and attests the official Windows executables for a release tag and opens a draft release
# (docs/adr/0008-release-pipeline.md). This is the only place RONGROI_OFFICIAL_BUILD=1 is set (ADR 0007).

name: release

on:
  push:
    tags:
      - "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # No rust-cache and no package-manager cache: nothing written by another workflow may reach an official build.
      - name: Check the tag against the manifests and CHANGELOG.md
        id: check
        run: |
          cargo run --locked --quiet -p xtask -- release-check "$env:GITHUB_REF_NAME" --github-output "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: taiki-e/install-action@fa23953489c080190314742a9b907f8e97c6767c # v2.87.10
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install desktop UI dependencies
        run: |
          pnpm -C apps/desktop install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the official executables
        run: |
          $env:RONGROI_OFFICIAL_BUILD = '1'
          $env:RONGROI_COMMIT = (git rev-parse HEAD)
          cargo build --release --locked -p rongroi-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm -C apps/desktop tauri build --no-bundle -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Give the executables their release names
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/aeterna-rongroi-cli.exe "out/aeterna-rongroi-cli-$env:VERSION-windows-x64.exe"
          Copy-Item target/release/aeterna-rongroi.exe "out/aeterna-rongroi-$env:VERSION-windows-x64.exe"
      - name: Scan this runner with the built CLI
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          & "./out/aeterna-rongroi-cli-$env:VERSION-windows-x64.exe" scan --json | Out-File -Encoding utf8NoBOM report.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check the built files and write SHA256SUMS
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          cargo run --locked --quiet -p xtask -- release-verify "$env:GITHUB_REF_NAME" --report report.json `
            --cli "out/aeterna-rongroi-cli-$env:VERSION-windows-x64.exe" `
            --desktop "out/aeterna-rongroi-$env:VERSION-windows-x64.exe" `
            --commit (git rev-parse HEAD) --sums out/SHA256SUMS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write the SBOMs
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          cargo cyclonedx --describe binaries --format json --spec-version 1.5 --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item apps/desktop/src-tauri/aeterna-rongroi_bin.cdx.json "out/aeterna-rongroi-$env:VERSION-windows-x64.cdx.json"
          Move-Item crates/rongroi-cli/aeterna-rongroi-cli_bin.cdx.json "out/aeterna-rongroi-cli-$env:VERSION-windows-x64.cdx.json"
          pnpm -C apps/desktop sbom --sbom-format cyclonedx --prod --out "$PWD/out/aeterna-rongroi-$env:VERSION-ui.cdx.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write the release notes
        run: |
          cargo run --locked --quiet -p xtask -- release-notes "$env:GITHUB_REF_NAME" --report report.json --sums out/SHA256SUMS `
            --commit (git rev-parse HEAD) `
            --run-url "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
            --repo "$env:GITHUB_REPOSITORY" --out out/notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: out/
          if-no-files-found: error
          retention-days: 1

  attest:
    name: attest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - name: Check the hashes before signing
        working-directory: out
        run: sha256sum -c --strict SHA256SUMS
      - name: Attest build provenance of both executables
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: out/SHA256SUMS
      - name: Attest the desktop app's Rust SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/aeterna-rongroi-${{ needs.build.outputs.version }}-windows-x64.exe
          sbom-path: out/aeterna-rongroi-${{ needs.build.outputs.version }}-windows-x64.cdx.json
      - name: Attest the desktop app's UI SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/aeterna-rongroi-${{ needs.build.outputs.version }}-windows-x64.exe
          sbom-path: out/aeterna-rongroi-${{ needs.build.outputs.version }}-ui.cdx.json
      - name: Attest the CLI's SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/aeterna-rongroi-cli-${{ needs.build.outputs.version }}-windows-x64.exe
          sbom-path: out/aeterna-rongroi-cli-${{ needs.build.outputs.version }}-windows-x64.cdx.json

  publish:
    name: draft release
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: out
      - name: Check the hashes again
        working-directory: out
        run: sha256sum -c --strict SHA256SUMS
      - name: Create the draft release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          for exe in ./*.exe; do
            name="${exe#./}"
            if ! awk '{print $2}' SHA256SUMS | grep -qxF "$name"; then
              echo "::error::$name is not listed in SHA256SUMS"
              exit 1
            fi
          done
          flags=(--draft --verify-tag --title "aeterna-rongroi $VERSION" --notes-file notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" ./*.exe SHA256SUMS ./*.cdx.json
